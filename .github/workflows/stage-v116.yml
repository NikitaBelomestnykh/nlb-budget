name: Stage and publish v1.16.0
on:
  push:
    branches: [main]
    paths: [.github/workflows/stage-v116.yml]
permissions:
  contents: write
concurrency:
  group: mac-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply and verify tested source
        run: |
          test "$(git rev-parse HEAD^)" = 39bd3460e9767c4d45afa3da98a64c74a2fdf7e1
          test "$(git rev-parse HEAD~8)" = 75e921ebf640efb61f6fb558659198c9afbc0aac
          cat release-patches/v116.part-* > /tmp/nlb-v116.patch
          test "$(shasum -a 256 /tmp/nlb-v116.patch | cut -d' ' -f1)" = cb740c06cbce6dc4365e3102e83bb5136c139d3d77a6e65f234c6b01076f1925
          git apply --check /tmp/nlb-v116.patch
          git apply /tmp/nlb-v116.patch
          test "$(shasum -a 256 release-patches/v116-scrolling-test.patch | cut -d' ' -f1)" = f1b52cfc033d14ff330adb5688ced010c8f7d18ee1704a63910b84444991be8c
          git apply --check release-patches/v116-scrolling-test.patch
          git apply release-patches/v116-scrolling-test.patch
          rm release-patches/v116.part-* release-patches/v116-scrolling-test.patch
          shasum -a 256 -c <<'HASHES'
          7717c11f7d33b9e0f7d1f0a610d0f21db52ea6ef42f98142e94a4b2211ed477d  index.html
          a7f317760d088b31421a995b45372041febcefafe13e5ebc153cdd7ab19fdcce  assets/payments.css
          495352ed99525527364416fc926280ad6a754e9f8e060c6a150d4b57882d2fa1  assets/guide.js
          a22f6e5439ea148c1bbdfafda6c12b301598be263f3cec3d1995b0135e7a3f62  PAYMENTS.md
          81f7a35865f6c274becfb696303e8a9c2d05920f7d328f5cdfa329f1cf0c45d3  USER_GUIDE.md
          09b3c8b81e271816ff8ac08fa202b633765db96b7a7a116781d9c87984df9bea  package.json
          470666b78da52db420e6c5445b1933d85fc8802a9ea8c75f632d4062e637c624  tests/calendar-v115.test.cjs
          d01d69e1916c69f08d7d7d27a7eb4ca9f5a0e831fc84347eb02f8ca5a6cdf831  tests/design-v116.test.cjs
          a5f6d249743814ce225a3966a9ded8ac68cd8923b5fb50ee1ae088896595cbaa  tests/timeline-calendar.test.cjs
          HASHES
      - name: Install dependencies and browser
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install chromium
      - name: Test financial, contact and calendar workflows
        run: |
          for f in tests/*.test.cjs; do
            if node "$f" > /tmp/nlb-test.log 2>&1; then cat /tmp/nlb-test.log; else
              cat /tmp/nlb-test.log
              msg=$(python3 -c 'from pathlib import Path; print(Path("/tmp/nlb-test.log").read_text()[-3000:].replace("%","%25").replace("\n","%0A").replace("\r","%0D"))')
              echo "::error title=Failed test $f::$msg"
              exit 1
            fi
          done
      - name: Commit verified source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add tests/design-v116.test.cjs
          git commit -m 'Release v1.16.0 timeline, calendar and contact redesign'
          git push origin HEAD:main
      - name: Build and publish Apple Silicon Mac release
        run: npm run release:mac -- --arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
