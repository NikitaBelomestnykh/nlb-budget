name: Stage and publish v1.20.1
on:
  push:
    branches: [main]
    paths: [.github/workflows/stage-v1201.yml]
permissions:
  contents: write
concurrency:
  group: mac-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply and verify tested source
        run: |
          test "$(git rev-parse HEAD^)" = 86af38258ed07626ab2c0f430ee688263884b763
          test "$(git rev-parse HEAD~2)" = 5aa6502a91eebce6f28eec399877405ecb43b9ba
          cat release-patches/v1201-*.part > /tmp/nlb-v1201.patch
          test "$(shasum -a 256 /tmp/nlb-v1201.patch | cut -d' ' -f1)" = 508d41518fd54833c43c0c1082547a8178faa6fc0a4b55ef20f772e5fbc72ef8
          git apply --check /tmp/nlb-v1201.patch
          git apply /tmp/nlb-v1201.patch
          rm release-patches/v1201-*.part
          shasum -a 256 -c <<'HASHES'
          556b82ac03042e54bd77f19d5cc95fbcbef2befb037c23d4d6fc51f0fd8566c7  DESIGN_STYLE.md
          e22d26a685976d5e894d1bfa049eb19a16bac0c11d179581da76ad8017067e20  README.md
          e498e65ccf3ae83f301f00cf5670f22cc8d6c3f70da9737cc78a7e2920788199  USER_GUIDE.md
          5c10768444ee5977d49b65804b447fdbffef6b0a614c4715daca376602e0c8c4  assets/guide.js
          5263afcb6b031da7a041e22e23570d354ea1528858428a8ae5185e5a14d0e283  assets/payments.css
          ae6345b401350f585a9f378c8ecf615b352f1ade8309eb9ef68dcd2713630eae  index.html
          20982d8a52bf00d1812952d9543cda0913a19453cb2c440f2b962330d7e87e37  package.json
          5c00ea626a5e37b00137dfbe43824760b20b32604ca7223585df335aa5964f23  tests/design-polish-v1201.test.cjs
          HASHES
      - name: Install dependencies and browser
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install chromium
      - name: Run all financial and browser tests
        run: |
          for f in tests/*.test.cjs; do
            if node "$f" > /tmp/nlb-test.log 2>&1; then cat /tmp/nlb-test.log; else
              cat /tmp/nlb-test.log
              msg=$(python3 -c 'from pathlib import Path; print(Path("/tmp/nlb-test.log").read_text()[-3000:].replace("%","%25").replace("\n","%0A").replace("\r","%0D"))')
              echo "::error title=Failed test $f::$msg"
              exit 1
            fi
          done
      - name: Commit verified source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add DESIGN_STYLE.md tests/design-polish-v1201.test.cjs
          git commit -m 'Release v1.20.1 design and timeline polish'
          git push origin HEAD:main
      - name: Build and publish Apple Silicon Mac release
        run: npm run release:mac -- --arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
