name: Stage and publish vendor dashboard 1.13.0
on:
  push:
    branches: [main]
    paths: [.github/workflows/stage-vendor-release.yml]
permissions:
  contents: write
concurrency:
  group: mac-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply and verify tested source
        run: |
          test "$(git rev-parse HEAD~6)" = b07d56f7764c96c5586a0abc16b778c3494f05b4
          cat release-patches/vendor-1.13.0.part-* > /tmp/nlb-vendor-release.patch
          git apply --check /tmp/nlb-vendor-release.patch
          git apply /tmp/nlb-vendor-release.patch
          rm release-patches/vendor-1.13.0.part-* .github/workflows/stage-vendor-release.yml
          shasum -a 256 -c <<'HASHES'
          42f6c9b2e83e1a87c1b505bfa5c6ba13825007ae4e863fd2ba88598a15b9e61f  index.html
          f1720637f7dfd64664b5fbb249845143966277c322bd34c78d03d17baee81550  assets/payments.css
          5c54287c1e06a83b9152906691d45fece0cfcae802a1d90e94f7ddd40d6a60bc  assets/guide.js
          bbdf0f0f4f4adb889b6410ee1dd6e450feef32c5139270dd335b69345efae25f  PAYMENTS.md
          5ed440647dcef384e339608fa13dc3e0826a8ac4089bb1b6ed313426f22dfea7  USER_GUIDE.md
          56b8a75e88a520e14e2e86d960753dc7a08ce77347c75c89ca661664df5ab2cb  RELEASE_CHECKLIST.md
          bb40cbc7379a94bb567e0469df036dfe85ea87f86c50f62662634f87f4ad8155  package.json
          487fb84d01f90463da5012286f828f9f231455bcf2cfd0a7ad931a9a8a4fccb7  tests/vendor-example-local.test.cjs
          a9def8ffaf7500dc5474731e38ca287d4215ad70a687774687855b5f78446a6b  tests/vendor-workflow-local.test.cjs
          7721ae3e971182026e5edf4f580339d19af13a48d5d166e9167e1aa411ef2402  tests/calendar-daily-local.test.cjs
          HASHES
          sed -i '' 's/runs-on: macos-14/runs-on: macos-15/' .github/workflows/release-mac.yml
      - name: Validate financial and application safeguards
        run: |
          node tests/payments-core.test.cjs
          node tests/lifecycle-core.test.cjs
          node tests/guide.test.cjs
          node tests/navigation.test.cjs
          node tests/budget-pdf.test.cjs
      - name: Install application and browser test dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install chromium
      - name: Validate vendor workflow and backups
        run: |
          node tests/vendor-example-local.test.cjs
          node tests/vendor-workflow-local.test.cjs
          node tests/calendar-daily-local.test.cjs
      - name: Commit the verified release source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add tests/vendor-example-local.test.cjs tests/vendor-workflow-local.test.cjs tests/calendar-daily-local.test.cjs
          git commit -m 'Release v1.13.0 vendor dashboard and agreements'
          git push origin HEAD:main
      - name: Build and publish Apple Silicon Mac release
        run: npm run release:mac -- --arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
