name: Stage and publish v1.19.0
on:
  push:
    branches: [main]
    paths: [.github/workflows/stage-v119.yml]
permissions:
  contents: write
concurrency:
  group: mac-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply and verify tested source
        run: |
          test "$(git rev-parse HEAD^)" = 311990b156c1cdb7c7e816d2649a0a111b5b8b7c
          test "$(git rev-parse HEAD~7)" = 6a076730ad8b8ff42fb0d6d598cf63435690d5f8
          cat release-patches/v119-*.part > /tmp/nlb-v119.patch
          test "$(shasum -a 256 /tmp/nlb-v119.patch | cut -d' ' -f1)" = 782e9b352bfde5c1a3e569641a7f52716ba0e7686d5f9243e3928321d2af2756
          git apply --check /tmp/nlb-v119.patch
          git apply /tmp/nlb-v119.patch
          rm release-patches/v119-*.part
          shasum -a 256 -c <<'HASHES'
          ae9b2046b3281f86092d3b4c70ae46a91179c012bb380f9f46d317a7e19bdfe6  index.html
          0bbda647600d47e15bf322654845b0f544b07c88a779e2b4c1ee3cbc5844584f  assets/payments.css
          fd9023ea40a3d5f8209131eab890abd3ca30707b18a0cb5ffc4fcb8055c6cec7  assets/guide.js
          93ef9c87c859abb4cc5f03500fee5326849f738b6e41a9059967d6eaf1e9b825  package.json
          7405f503600b864d1cc810b82210228ce260a2ecea6759626244d13c99eaef87  USER_GUIDE.md
          288a904a192e6330730cee3ac6584bebbd4f8b763b1f8d99a8dc0a040d00c2c7  tests/payment-journey-v119.test.cjs
          5b768967c100b6ed9709bc8e59dd41ae6ed8d117fc8305ad3df5ae616cf29bd9  tests/recipient-tbd-v118.test.cjs
          e7b37d12606bbd8b53fd9624872e54cfa5af6d160afbe86985dc52d15c87b873  tests/calendar-v115.test.cjs
          HASHES
      - name: Install dependencies and browser
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install chromium
      - name: Test financial, contact and calendar workflows
        run: |
          for f in tests/*.test.cjs; do
            if node "$f" > /tmp/nlb-test.log 2>&1; then cat /tmp/nlb-test.log; else
              cat /tmp/nlb-test.log
              msg=$(python3 -c 'from pathlib import Path; print(Path("/tmp/nlb-test.log").read_text()[-3000:].replace("%","%25").replace("\n","%0A").replace("\r","%0D"))')
              echo "::error title=Failed test $f::$msg"
              exit 1
            fi
          done
      - name: Commit verified source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add tests/payment-journey-v119.test.cjs
          git commit -m 'Release v1.19.0 simplified payment journey'
          git push origin HEAD:main
      - name: Build and publish Apple Silicon Mac release
        run: npm run release:mac -- --arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
