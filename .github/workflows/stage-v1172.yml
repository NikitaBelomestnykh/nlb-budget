name: Stage and publish v1.17.2
on:
  push:
    branches: [main]
    paths: [.github/workflows/stage-v1172.yml]
permissions:
  contents: write
concurrency:
  group: mac-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply and verify tested source
        run: |
          test "$(git rev-parse HEAD^)" = 9c4754ce934c9e8be38f1641e9b37fce33235475
          test "$(git rev-parse HEAD~2)" = a267a9b48e21dcbf675de8744c9414b390d32b92
          test "$(shasum -a 256 release-patches/v1172.patch | cut -d' ' -f1)" = 862086b8e54ba91405bffe4050ed8339b53b3bc6945108c78790064be8f9d558
          git apply --check release-patches/v1172.patch
          git apply release-patches/v1172.patch
          rm release-patches/v1172.patch
          shasum -a 256 -c <<'HASHES'
          804a848de47d0765e6276841e418353ecad5601ce5899d8b2677b7935556e368  assets/payments.css
          6a6a639df8d2516469e98339843ffe1b8c19b51913b96f2874b20b301228acc5  package.json
          21156ea1e8015f5c9763e31b0bee5f3e76cdb46919ef2b4cd432b99020ba8108  tests/next-design-v117.test.cjs
          HASHES
      - name: Install dependencies and browser
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install chromium
      - name: Test financial, contact and calendar workflows
        run: |
          for f in tests/*.test.cjs; do
            if node "$f" > /tmp/nlb-test.log 2>&1; then cat /tmp/nlb-test.log; else
              cat /tmp/nlb-test.log
              msg=$(python3 -c 'from pathlib import Path; print(Path("/tmp/nlb-test.log").read_text()[-3000:].replace("%","%25").replace("\n","%0A").replace("\r","%0D"))')
              echo "::error title=Failed test $f::$msg"
              exit 1
            fi
          done
      - name: Commit verified source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'Release v1.17.2 compact installment allocations'
          git push origin HEAD:main
      - name: Build and publish Apple Silicon Mac release
        run: npm run release:mac -- --arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
