name: Stage and publish v1.15.0
on:
  push:
    branches: [main]
    paths: [.github/workflows/stage-v115.yml]
permissions:
  contents: write
concurrency:
  group: mac-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply and verify tested source
        run: |
          test "$(git rev-parse HEAD^)" = 81f8f49d8ec62079713a5b17e71aca61f2064aa6
          test "$(git rev-parse HEAD~8)" = 7afee374578b5f3de865c587f3b4f823a6b497bc
          cat release-patches/v115.part-* > /tmp/nlb-115.patch
          test "$(shasum -a 256 /tmp/nlb-115.patch | cut -d' ' -f1)" = c6c7edca6f8416d52a8f5f8147f063b9a1768efd3d170ed8152063afde825998
          git apply --check /tmp/nlb-115.patch
          git apply /tmp/nlb-115.patch
          rm release-patches/v115.part-*
          shasum -a 256 -c <<'HASHES'
          7f50f9f36d3a30c4cec9813216b64a0b6ed723d34b46697cf7ac87da1976dca4  index.html
          f295beaad18ee1090e0090a2e1c261bdbe024347fa4b74b4aad626fdd4a65259  assets/payments.css
          2e46a7a2a59a297184adec4beb6f8db708e263d0dc14572908f0eb37756535cb  assets/guide.js
          df2b31e8aab3646e6c38f3ca7629b4b88a192db6cd7c65af540db2fa608ff09c  package.json
          aee2b90d2609ef0dad3020be714a56896dfce2e56f3b8e72091b435112b5e570  PAYMENTS.md
          e2fce30cd8f3289e2abdebd84044a2b13ccb28ba9083552468e466734171d80a  USER_GUIDE.md
          142a64f17f5367b7a22ada8ed546f12d4479df4ab1b2bb1cc8bb1b9267ca257d  RELEASE_CHECKLIST.md
          4d1f02f03188dac5e7ce95fbbf26fdb7964dd0021785c42d8fa670e2096f796e  build/installer.icns
          57302553a03bcb0f8a534c52492a1724100b6ad5bb79a49cff5d7d7f73eeb013  build/installer.png
          aaa0c703e2e7f312081146809432b2f267eb97e9eeb1eb5fe4f8920888cfae44  .github/workflows/release-mac.yml
          f5d6996ac7f6fbaffc586bbf1203d9f0ee831b404b2efe95d02d6130467a6e28  tests/budget-pdf.test.cjs
          1d674e840a9171086e4846a2f65fc849f85d494233a54ddad993d664f6b456cf  tests/calendar-daily-local.test.cjs
          a788bf8fb0304a86a4f6b4a9456e00726fef26b21831387e07a8da8187c67b0c  tests/calendar-export-v115.test.cjs
          2c9531c0172396ea1325e692b6b3243eaadd2962652f49c471feda9b8db896ef  tests/calendar-v115.test.cjs
          45934dc689acc90eeb8a31a7d113f9fb60b0914030dd1eb4fe355408aac55509  tests/contact-csv-v115.test.cjs
          3f007f783994de96568dc7f41afa6f5d9e0778bed0497261895e5db77c474f18  tests/contact-edit-v115.test.cjs
          3d110f25996843af21c37cd6540b548b022cabaaa8c4b9fe7e6e8c0e6090dd1c  tests/crew-cast.test.cjs
          48b9c8c14bb64654c7a26dca2a88ba068896f9e1d4588f0cd331806491d4a69b  tests/guide.test.cjs
          60be3a61862e0f3c6d271c6808df8c6e97f0e13723e7f52205316c96e83478d6  tests/legacy-contact-v115.test.cjs
          3e8f0eeb1e9b710a7c1b6d320f27d2b27037fad6c3e349b706ba16c386fe7720  tests/lifecycle-core.test.cjs
          cb884da2ff827939499cdaeb2f411202834964793a2b7d7a26455be199303ff3  tests/navigation.test.cjs
          dbe4484856a3a93ae645b0453b6f4ecd9a0f14468987fa8c07394ceca1324a46  tests/payments-core.test.cjs
          0c4e5c08ff0bcdf8697a5f381f945db727df7a265ce2799554adf5c88024c313  tests/timeline-calendar.test.cjs
          70ac0bf677467d3f8e9e59371e64c7bd1ddc54003ddc78f3d9b13a04226f86ac  tests/vendor-example-local.test.cjs
          60613e05c410d5cf5f156b40c09650479fcfec636bc8f18ef9bee11923b6e260  tests/vendor-upload-button.test.cjs
          e76a3f3d9bf69df8dd74e8329f93754cd3ffb19c0849f687969ff367c871e103  tests/vendor-visual.test.cjs
          8be5d962c44117b5e5d7871b31bae12e9e6121ec6144c16dd8779331e15231c2  tests/vendor-workflow-local.test.cjs
          HASHES
      - name: Install dependencies and browser
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install chromium
      - name: Test all financial, contact and calendar workflows
        run: |
          for f in tests/*.test.cjs; do node "$f"; done
      - name: Commit verified source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git restore .github/workflows/release-mac.yml
          git add -u
          git add build/installer.icns build/installer.png tests/calendar-export-v115.test.cjs tests/calendar-v115.test.cjs tests/contact-csv-v115.test.cjs tests/contact-edit-v115.test.cjs tests/legacy-contact-v115.test.cjs
          git commit -m 'Release v1.15.0 calendar, timeline and contact improvements'
          git push origin HEAD:main
      - name: Build and publish Apple Silicon Mac release
        run: npm run release:mac -- --arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
