name: Stage and publish v1.18.0
on:
  push:
    branches: [main]
    paths: [.github/workflows/stage-v118.yml]
permissions:
  contents: write
concurrency:
  group: mac-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply and verify tested source
        run: |
          test "$(git rev-parse HEAD^)" = 6593eea74a3c2fa21578f711d2b5e63ce5fd8023
          test "$(git rev-parse HEAD~7)" = 643d7b0d86571ec5a8599c273f637604751ffc90
          cat release-patches/v118-*.part > /tmp/nlb-v118.patch
          test "$(shasum -a 256 /tmp/nlb-v118.patch | cut -d' ' -f1)" = b8a6b4f2fee3be288c8bd9715a7ec7e1a4cb4b622a5833be2e34b4f123c26d16
          git apply --check /tmp/nlb-v118.patch
          git apply /tmp/nlb-v118.patch
          rm release-patches/v118-*.part
          shasum -a 256 -c <<'HASHES'
          e5486aabd14027a9842edadc7c47cbd9b6ef123135b32337f9e479f8f0094aae  index.html
          54e80056ad699c407a5384fbacd781b446f6d24c791fa6fe6b9152d21bca2186  assets/payments.css
          3aa5a383563e20e486b474720eb051ae56377e179783fb221d1145c29b57d270  package.json
          6f0fab041dc29a33502abaf3a8dd7451345604eb7165db218e0e3e676f9b4c8a  USER_GUIDE.md
          c59da15fb5bd7b37c68a0b8c12f0178ec7bdc354df1a75d09a1f64405f0b0fc8  tests/recipient-tbd-v118.test.cjs
          HASHES
      - name: Install dependencies and browser
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install chromium
      - name: Test financial, contact and calendar workflows
        run: |
          for f in tests/*.test.cjs; do
            if node "$f" > /tmp/nlb-test.log 2>&1; then cat /tmp/nlb-test.log; else
              cat /tmp/nlb-test.log
              msg=$(python3 -c 'from pathlib import Path; print(Path("/tmp/nlb-test.log").read_text()[-3000:].replace("%","%25").replace("\n","%0A").replace("\r","%0D"))')
              echo "::error title=Failed test $f::$msg"
              exit 1
            fi
          done
      - name: Commit verified source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add tests/recipient-tbd-v118.test.cjs
          git commit -m 'Release v1.18.0 recipient-optional payment planning'
          git push origin HEAD:main
      - name: Build and publish Apple Silicon Mac release
        run: npm run release:mac -- --arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
