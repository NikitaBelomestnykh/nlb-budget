<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NO LONGER BUDGET</title>
<style>
  :root {
    --page: #EBEBEB; --canvas: #FFFFFF; --surface-2: #EBEBEB; --border: #D9D9D9;
    --text: #0B0B0B; --text-2: #3D3D3D; --accent: #F4B63F; --accent-soft: #FBF3E2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0B0B0B; --canvas: #242323; --surface-2: #3D3D3D; --border: rgba(255,255,255,.15);
      --text: #FFFFFF; --text-2: rgba(255,255,255,.65); --accent: #F4B63F; --accent-soft: rgba(244,182,63,.15);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--page); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-user-select: none; user-select: none; }
  .wrap { display: flex; flex-direction: column; height: 100vh; }
  header { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--border); background: var(--canvas); flex: none; }
  header h1 { font-size: 16px; font-weight: 800; margin: 0; flex: 1; }
  input[type=text] { font: inherit; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); color: var(--text); -webkit-user-select: text; user-select: text; }
  #search { width: 260px; }
  select { font: inherit; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); color: var(--text); }
  .btn { font: inherit; font-weight: 600; border-radius: 8px; padding: 8px 14px; cursor: pointer; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); }
  .btn:hover { background: var(--accent-soft); border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); }
  main { flex: 1; overflow-y: auto; padding: 16px 20px 40px; }
  .folder-heading { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-2); margin: 20px 4px 8px; font-weight: 700; }
  .file-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
  .file-row:hover { background: var(--canvas); border-color: var(--border); }
  .file-name { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-meta { font-size: 12px; color: var(--text-2); flex: none; }
  .file-actions { display: none; gap: 4px; flex: none; }
  .file-row:hover .file-actions { display: flex; }
  .icon-btn { background: transparent; border: none; color: var(--text-2); cursor: pointer; border-radius: 6px; width: 26px; height: 26px; font-size: 13px; }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }
  .empty { text-align: center; padding: 80px 20px; color: var(--text-2); }
  .empty h2 { color: var(--text); margin: 0 0 8px; }
  footer { padding: 8px 20px; font-size: 11px; color: var(--text-2); border-top: 1px solid var(--border); background: var(--canvas); flex: none; }
  footer a { color: var(--text-2); text-decoration: underline; cursor: pointer; }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 1000; }
  .modal-backdrop[hidden] { display: none; }
  .modal-box { background: var(--canvas); border: 1px solid var(--border); border-radius: 10px; padding: 20px; width: 320px; box-shadow: 0 12px 40px rgba(0,0,0,.3); }
  .modal-box h3 { margin: 0 0 12px; font-size: 14px; font-weight: 700; }
  .modal-box input[type=text] { width: 100%; margin-bottom: 6px; }
  .modal-hint { font-size: 11px; color: var(--text-2); margin: 0 0 14px; -webkit-user-select: text; user-select: text; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>NO LONGER BUDGET</h1>
    <input type="text" id="search" placeholder="Search budgets\u2026">
    <select id="folder-filter"><option value="">All Folders</option></select>
    <button class="btn" id="new-folder-btn">New Folder</button>
    <button class="btn primary" id="new-budget-btn">+ New Budget</button>
  </header>
  <main id="list"></main>
  <footer>Budgets are stored as .nlb files in your Documents folder. <a id="reveal-link">Show in Finder</a></footer>
</div>

<div class="modal-backdrop" id="modal-backdrop" hidden>
  <div class="modal-box">
    <h3 id="modal-title">Enter a name</h3>
    <p class="modal-hint" id="modal-hint" hidden></p>
    <input type="text" id="modal-input">
    <div class="modal-actions">
      <button class="btn" id="modal-cancel">Cancel</button>
      <button class="btn primary" id="modal-ok">OK</button>
    </div>
  </div>
</div>

<script>
(function () {
  var allFiles = [];
  var allFolders = [];
  var rootPath = '';

  // Electron's renderer does not implement window.prompt() (unlike alert()/
  // confirm(), which Electron does support as native dialogs); calling it
  // silently returns null/undefined with no UI shown. This in-page modal
  // replaces it for all "ask the user for a name" flows below.
  function showPrompt(title, defaultValue, hint) {
    return new Promise(function (resolve) {
      var backdrop = document.getElementById('modal-backdrop');
      var titleEl = document.getElementById('modal-title');
      var hintEl = document.getElementById('modal-hint');
      var input = document.getElementById('modal-input');
      var okBtn = document.getElementById('modal-ok');
      var cancelBtn = document.getElementById('modal-cancel');

      titleEl.textContent = title;
      if (hint) { hintEl.textContent = hint; hintEl.hidden = false; } else { hintEl.hidden = true; }
      input.value = defaultValue || '';
      backdrop.hidden = false;
      input.focus();
      input.select();

      function cleanup(result) {
        backdrop.hidden = true;
        okBtn.removeEventListener('click', onOk);
        cancelBtn.removeEventListener('click', onCancel);
        input.removeEventListener('keydown', onKeydown);
        resolve(result);
      }
      function onOk() { cleanup(input.value.trim() || null); }
      function onCancel() { cleanup(null); }
      function onKeydown(e) {
        if (e.key === 'Enter') onOk();
        if (e.key === 'Escape') onCancel();
      }
      okBtn.addEventListener('click', onOk);
      cancelBtn.addEventListener('click', onCancel);
      input.addEventListener('keydown', onKeydown);
    });
  }

  function timeAgo(ms) {
    var diff = Date.now() - ms;
    var mins = Math.round(diff / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    var hrs = Math.round(mins / 60);
    if (hrs < 24) return hrs + 'h ago';
    var days = Math.round(hrs / 24);
    if (days < 30) return days + 'd ago';
    return new Date(ms).toLocaleDateString();
  }

  function render() {
    var q = document.getElementById('search').value.trim().toLowerCase();
    var folderFilter = document.getElementById('folder-filter').value;
    var filtered = allFiles.filter(function (f) {
      if (folderFilter && f.folder !== folderFilter) return false;
      if (folderFilter === '' && q === '' ) return true;
      if (q && f.name.toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
    var groups = {};
    filtered.forEach(function (f) {
      var key = f.folder || '';
      if (!groups[key]) groups[key] = [];
      groups[key].push(f);
    });
    var groupKeys = Object.keys(groups).sort(function (a, b) {
      if (a === '') return -1;
      if (b === '') return 1;
      return a.localeCompare(b);
    });
    var list = document.getElementById('list');
    list.innerHTML = '';
    if (!filtered.length) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.innerHTML = '<h2>No budgets found</h2><p>' + (allFiles.length ? 'Try a different search.' : 'Click \u201c+ New Budget\u201d to get started.') + '</p>';
      list.appendChild(empty);
      return;
    }
    groupKeys.forEach(function (key) {
      var heading = document.createElement('div');
      heading.className = 'folder-heading';
      heading.textContent = key === '' ? 'Budgets' : key;
      list.appendChild(heading);
      groups[key].sort(function (a, b) { return b.mtimeMs - a.mtimeMs; }).forEach(function (f) {
        var row = document.createElement('div');
        row.className = 'file-row';
        row.innerHTML =
          '<span class="file-name"></span>' +
          '<span class="file-meta"></span>' +
          '<span class="file-actions">' +
          '<button class="icon-btn" data-act="rename" title="Rename">\u270e</button>' +
          '<button class="icon-btn" data-act="duplicate" title="Duplicate">\u2398</button>' +
          '<button class="icon-btn" data-act="delete" title="Delete">\u2715</button>' +
          '</span>';
        row.querySelector('.file-name').textContent = f.name;
        row.querySelector('.file-meta').textContent = timeAgo(f.mtimeMs);
        row.addEventListener('click', function (e) {
          if (e.target.closest('.icon-btn')) return;
          window.electronLauncher.openFile(f.path);
        });
        row.querySelector('[data-act="rename"]').addEventListener('click', async function (e) {
          e.stopPropagation();
          var name = await showPrompt('Rename budget', f.name);
          if (!name || name === f.name) return;
          await window.electronFS.renameBudget(f.path, name);
          load();
        });
        row.querySelector('[data-act="duplicate"]').addEventListener('click', async function (e) {
          e.stopPropagation();
          await window.electronFS.duplicateBudget(f.path);
          load();
        });
        row.querySelector('[data-act="delete"]').addEventListener('click', async function (e) {
          e.stopPropagation();
          if (!window.confirm('Move "' + f.name + '" to Trash?')) return;
          await window.electronFS.deleteBudget(f.path);
          load();
        });
        list.appendChild(row);
      });
    });
  }

  async function load() {
    var data = await window.electronFS.listBudgets();
    allFiles = data.files || [];
    allFolders = data.folders || [];
    rootPath = data.root || '';
    var sel = document.getElementById('folder-filter');
    var current = sel.value;
    sel.innerHTML = '<option value="">All Folders</option>';
    allFolders.sort().forEach(function (name) {
      var opt = document.createElement('option');
      opt.value = name; opt.textContent = name;
      sel.appendChild(opt);
    });
    sel.value = current;
    render();
  }

  document.getElementById('search').addEventListener('input', render);
  document.getElementById('folder-filter').addEventListener('change', render);
  document.getElementById('reveal-link').addEventListener('click', function () {
    window.electronFS.revealInFolder(rootPath);
  });
  document.getElementById('new-folder-btn').addEventListener('click', async function () {
    var name = await showPrompt('New folder name');
    if (!name) return;
    await window.electronFS.createFolder(name);
    load();
  });
  document.getElementById('new-budget-btn').addEventListener('click', async function () {
    var name = await showPrompt('Budget name', 'Untitled Budget');
    if (!name) return;
    var folder = null;
    if (allFolders.length) {
      folder = await showPrompt('Folder (leave blank for none)', '', 'Existing folders: ' + allFolders.join(', '));
    } else {
      folder = await showPrompt('Folder name (leave blank for none)');
    }
    window.electronLauncher.newFile({ name: name, folder: folder || null });
  });

  async function migrateLegacyBudgetsIfNeeded() {
    try {
      var migrated = await window.electronFS.isMigrated();
      if (migrated) return;
      var raw = null;
      try { raw = window.localStorage.getItem('no-longer-budget-v9'); } catch (e) {}
      if (raw) {
        var s = JSON.parse(raw);
        if (s && s.budgets && s.budgets.length) {
          var folders = (s.folders || []).map(function (f) { return { id: f.id, name: f.name }; });
          var budgets = s.budgets.map(function (b) { return { name: b.title, folderId: b.folderId || null, data: b }; });
          await window.electronFS.migrateBudgets(budgets, folders);
        }
      }
      await window.electronFS.setMigrated();
    } catch (e) {}
  }

  migrateLegacyBudgetsIfNeeded().then(load);
  setInterval(load, 4000);
})();
</script>
</body>
</html>
