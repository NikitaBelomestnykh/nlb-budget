  function migrate(s) {
    if (!s || !s.budgets) return s;
    if (!s.folders) s.folders = [];
    s.budgets.forEach(function (b) {
      if (b.folderId === undefined) b.folderId = null;
      (b.accounts || []).forEach(function (a) {
        if (!a.subAccounts) a.subAccounts = [];
        if (!a.fringeIds) a.fringeIds = [];
        a.subAccounts.forEach(function (sub) {
          if (!sub.lines) sub.lines = [];
          if (!sub.groupIds) sub.groupIds = [];
          sub.lines.forEach(function (l) {
            if (!l.kind) l.kind = "line";
            if (!l.fringeIds) l.fringeIds = [];
            if (!l.groupIds) l.groupIds = [];
            if (l.actual === undefined) l.actual = "";
          });
        });
      });
      if (!b.currency) b.currency = "USD";
      if (!b.globals) b.globals = [];
      if (!b.fringes) b.fringes = [];
      if (!b.groups) b.groups = [];
      if (!b.units || !b.units.length) b.units = DEFAULT_UNITS.map(function (u) { return { name: u.name, plural: u.plural }; });
      if (b.locked == null) b.locked = false;
      if (b.originalTotal === undefined) b.originalTotal = null;
      if (b.showActuals == null) b.showActuals = false;
      if (typeof b.contingencyPercent !== "number") {
        var contAcc = null;
        (b.accounts || []).forEach(function (a) { if (a.group === "Contingency") contAcc = a; });
        if (contAcc) {
          var contAmt = accountSubtotal(contAcc);
          var baseAmt = (b.accounts || []).reduce(function (sum, a) { return a.group === "Contingency" ? sum : sum + accountSubtotal(a); }, 0);
          b.contingencyPercent = baseAmt > 0 ? Math.round((contAmt / baseAmt) * 1000) / 10 : 0;
        } else {
          b.contingencyPercent = 0;
        }
        b.accounts = (b.accounts || []).filter(function (a) { return a.group !== "Contingency"; });
      }
    });
    return s;
  }

  function load() {
    try {

      if (raw) {

      }
    } catch (e) {}
    return null;

  // ---- Native file storage (Electron) ----
  // Each .nlb file on disk holds exactly one budget object (the same shape
  // exportNLB()/importNLBFile() already use). In Electron the in-memory
  // 'state' wrapper ({budgets:[budget], activeBudgetId, folders:[]}) always
  // holds that single open budget; on plain-browser builds (no Electron),
  // everything falls back to the original single-blob localStorage model.
  var isElectron = !!(window.electronFS && window.electronMenu);
  var currentFilePath = null;
  var currentFileName = null;
  var fileDirty = false;
  var diskSaveTimer = null;

  function wrapBudgetAsState(budget) {
    return migrate({ budgets: [budget], activeBudgetId: budget.id, folders: [] });
  }

  function baseName(filePath) {
    return String(filePath || '').split(/[\/]/).pop().replace(/.nlb$/i, '');
  }

  function writeCurrentFileToDisk(cb) {
    if (!isElectron || !currentFilePath) { if (cb) cb(); return; }
    var budget = active();
    if (!budget) { if (cb) cb(); return; }
    window.electronFS.saveBudget(currentFilePath, budget).then(function () {
      fileDirty = false;
      if (window.electronFS.reportDirty) window.electronFS.reportDirty(false);
      markSaved();
      if (cb) cb();
    }).catch(function () { markSaved(); if (cb) cb(); });
  }

  function saveNow(cb) {
    if (isElectron) {
      if (diskSaveTimer) { clearTimeout(diskSaveTimer); diskSaveTimer = null; }
      writeCurrentFileToDisk(cb);
    } else {
      save();
      if (cb) cb();
    }
  }

  function save() {
    if (isElectron) {
      fileDirty = true;
      if (window.electronFS.reportDirty) window.electronFS.reportDirty(true);
      if (diskSaveTimer) clearTimeout(diskSaveTimer);
      diskSaveTimer = setTimeout(function () { writeCurrentFileToDisk(); }, 500);
      markSaved();
      return;
    }
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { window.alert('Budget could not be saved. Local storage may be full. Export a full backup now; do not quit until your data is backed up.'); throw e; }
    markSaved();
  }

  var lastSavedLabel = 'Saved';
  function markSaved() {
    var now = new Date();
    var time = now.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
    if (isElectron) {
      lastSavedLabel = fileDirty ? 'Saving…' : ('Saved · ' + time);
    } else {
      lastSavedLabel = 'Saved · ' + time;
    }
    var el = document.getElementById('save-indicator');
    if (el) el.textContent = lastSavedLabel;
    if (isElectron) document.title = (currentFileName || 'NO LONGER BUDGET') + (fileDirty ? ' — Unsaved Changes' : '');
  }

  function openBudgetFromDisk(filePath) {
    window.electronFS.readBudget(filePath).then(function (res) {
      state = wrapBudgetAsState(res.budget);
      currentFilePath = res.path;
      currentFileName = baseName(res.path);
      fileDirty = false;
      if (window.electronFS.setCurrentPath) window.electronFS.setCurrentPath(currentFilePath);
      if (window.electronFS.reportDirty) window.electronFS.reportDirty(false);
      view = { mode: 'sheet' };
      lastBudgetListSig = null;
      markSaved();
      render();

            var parts = String(currentFilePath).split(/[\/]/);
            parts.pop();
            var parentDir = parts.pop();

  function active() {

      if (state.budgets[i].id === state.activeBudgetId) return state.budgets[i];

    return state.budgets[0] || null;

    var b = active();
    if (!b) return null;
    for (var i = 0; i < b.accounts.length; i++) {
      var acc = b.accounts[i];
      for (var j = 0; j < acc.subAccounts.length; j++) {
        if (acc.subAccounts[j].id === id) return { account: acc, sub: acc.subAccounts[j] };
      }
    }
    return null;

  function indexOf(arr, id) {
    for (var i = 0; i < arr.length; i++) { if (arr[i].id === id) return i; }
    return -1;

  function orderedAccounts() {
    var b = active();

  function currencySymbol() {
    var b = active();
    var code = b && b.currency ? b.currency : "USD";
    return CURRENCIES[code] || "$";
  }

  function fmt(n) {
    n = Number(n) || 0;
    return currencySymbol() + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function lineAmount(l) {
    var x = (l.x === "" || l.x == null) ? 1 : (amountNumber(l.x) || 0);
    return (amountNumber(l.qty) || 0) * x * (amountNumber(l.rate) || 0);
  }

  function matchUnitDef(name) {
    if (name == null || name === '') return null;
    var b = active();
    if (!b || !b.units) return null;
    var lower = String(name).trim().toLowerCase();
    if (!lower) return null;
    for (var i = 0; i < b.units.length; i++) {
      var u = b.units[i];
      if ((u.name || '').toLowerCase() === lower || (u.plural || '').toLowerCase() === lower) return u;
    }
    return null;
  }

  function unitDisplayValue(l) {
    var raw = l.unit;
    if (raw == null || raw === '') return raw;
    var def = matchUnitDef(raw);
    if (!def) return raw;
    var qtyNum = amountNumber(l.qty);
    var isSingular = (!isNaN(qtyNum) && qtyNum === 1);
    return isSingular ? def.name : def.plural;
  }

  function refreshUnitDisplayForLine(l) {
    if (!l) return;
    var input = document.querySelector('.unit[data-id="' + l.id + '"]');

  function requestRenumber(ctx) {
    var list = rowList(ctx);
    if (!list.length) return;
    var start;
    var step = ctx.kind === 'account' ? 100 : 1;
    if (ctx.kind === 'account') {
      var first = Number(list[0].num);
      start = Number.isFinite(first) && first >= 100 ? Math.floor(first / 100) * 100 : ({ ATL: 1000, BT: 2000, BTLPost: 3000, OTHER: 4000 }[ctx.parent] || 1000);
    } else {
      var a = findAccount(ctx.parent);
      var parent = a && /^\d+$/.test(String(a.num)) ? Number(a.num) : NaN;
      if (!Number.isFinite(parent)) { showPrompt({ title: 'Account number required', help: 'Set a numeric parent account number before renumbering.', value: '', inputMode: 'text' }); return; }
      start = parent + 1;
    }
    var last = start + (list.length - 1) * step;
    if (last > 9999) { showPrompt({ title: 'Number range exceeded', help: 'This list would exceed the four-digit account-number range. No numbers were changed.', value: '', inputMode: 'text' }); return; }
    showConfirm('Renumber this list in its current order: ' + start + ' through ' + last + (step === 100 ? ', in steps of 100' : ', in steps of 1') + '? Other lists and nested account numbers are unchanged. You can undo with Cmd/Ctrl+Z.', function () {

    if (!expandedEditor) return;

  function closeExpandedEditor(commit) {
    if (!expandedEditor) return;
    var current = expandedEditor;
    expandedEditor = null;
    current.source.classList.remove('editing-in-popout');
    if (commit && current.source.isConnected) {
      current.source.value = current.input.value.replace(/\n/g, ' ');
      current.source.dispatchEvent(new FocusEvent('focusout', { bubbles: true }));
    }
    current.box.remove();
  }

  function maybeExpandEditor(source) {
    if (!source || !source.isConnected || source.readOnly || source.type === 'checkbox' || source.type === 'radio' || source.type === 'file' || source.type === 'number') return;
    if (!source.closest('.lines-table, .detail-head') || source.closest('.cell-editor-popout')) return;
    if (expandedEditor) return;
    var style = getComputedStyle(source);
    var available = source.clientWidth - parseFloat(style.paddingLeft || 0) - parseFloat(style.paddingRight || 0) - (source.list ? 20 : 0);
    if (textWidth(source.value, style.font) <= available) return;
    var box = document.createElement('div');
    box.className = 'cell-editor-popout';
    var label = document.createElement('div');
    label.className = 'cell-editor-label';
    label.textContent = source.getAttribute('aria-label') || 'Edit value';
    var input = document.createElement('textarea');
    input.className = 'cell-expanded-input';
    input.setAttribute('aria-label', label.textContent + ' expanded editor');
    input.spellcheck = false;
    input.value = source.value;
    if (source.maxLength > 0) input.maxLength = source.maxLength;
    var start = source.selectionStart, end = source.selectionEnd;
    box.appendChild(label); box.appendChild(input); document.body.appendChild(box);
    expandedEditor = { source: source, input: input, box: box };
    source.classList.add('editing-in-popout');
    positionExpandedEditor();
    input.addEventListener('input', function () {
      if (!expandedEditor || expandedEditor.source !== source) return;
      source.value = input.value.replace(/\n/g, ' ');
      source.setSelectionRange(input.selectionStart, input.selectionEnd);
      source.dispatchEvent(new Event('input', { bubbles: true }));
      input.value = source.value;
      input.setSelectionRange(source.selectionStart, source.selectionEnd);
      sizeExpandedEditor();
    });
    input.addEventListener('keydown', function (e) {
      if (e.isComposing) return;
      if (e.key === 'Tab' || e.key === 'Enter') {
        e.preventDefault(); e.stopPropagation();
        var field = source.dataset.field;
        var row = source.closest('tr[data-kind="line"]');
        var next = null;
        if (row && LINE_FIELD_ORDER.indexOf(field) !== -1) {
          if (e.key === 'Enter') {
            var rows = Array.from(document.querySelectorAll('tr[data-kind="line"]:not(.subtotal-row)'));
            var target = rows[rows.indexOf(row) + (e.shiftKey ? -1 : 1)];
            if (target) next = target.querySelector('[data-field="' + field + '"]');
          } else {
            var idx = LINE_FIELD_ORDER.indexOf(field) + (e.shiftKey ? -1 : 1);
            next = row.querySelector('[data-field="' + LINE_FIELD_ORDER[idx] + '"]');
          }
        }
        if (!next && e.key === 'Tab') {
          var focusables = Array.from(document.querySelectorAll('input:not([type="checkbox"]), select, button, a[href]')).filter(function (el) { return el.offsetParent !== null && !el.disabled && el.tabIndex >= 0; });
          next = focusables[focusables.indexOf(source) + (e.shiftKey ? -1 : 1)];
        }
        if (!next && e.key === 'Enter' && !e.shiftKey && !e.repeat && row && appendLineFromLastRow(row, field)) return;
        closeExpandedEditor(true);
        if (next) { next.focus(); if (next.select) next.select(); }
        else source.focus();
      } else if (e.key === 'Escape') {
        e.preventDefault(); e.stopPropagation();
        closeExpandedEditor(true);
        source.blur();
      }
    });
    input.addEventListener('focusout', function () { closeExpandedEditor(true); });
    input.focus();
    input.setSelectionRange(start == null ? 0 : start, end == null ? input.value.length : end);
    sizeExpandedEditor();
  }

  function hasAppliedFringes(lines) {

  function refreshDetailFringeRows() {
    if (view.mode !== 'detail') return;
    var found = findSubAccount(view.subAccountId), tbody = document.querySelector('#main .detail-table tbody');
    if (!found || !tbody) return;
    tbody.querySelectorAll('tr.fringe-row').forEach(function (tr) { tr.remove(); });
    var regular = [], segment = [];
    function insert(lines, before) {
      var base = lines.reduce(function (n, l) { return n + lineFringeAmount(l); }, 0);
      var actual = lines.reduce(function (n, l) { return n + lineFringeActualAmount(l); }, 0);
      var hot = lines.reduce(function (n, l) { return n + lineFringeHotCost(l); }, 0);
      if (!hasAppliedFringes(lines) && base === 0 && actual === 0 && hot === 0) return;
      var html = fringeRowHTML(found.account, found.sub, base, actual, hot);
      if (before) before.insertAdjacentHTML('beforebegin', html);
      else tbody.insertAdjacentHTML('beforeend', html);
    }
    found.sub.lines.forEach(function (l) {
      if (l.kind === 'subtotal') { insert(segment, tbody.querySelector('tr[data-id="' + l.id + '"]')); segment = []; }
      else { segment.push(l); regular.push(l); }
    });
    insert(regular, null);
  }

  function removeLine(subAccountId, lineId) {

      if (found.sub.lines[i].id === lineId) { item = found.sub.lines[i]; break; }

    if (!item) return;
    var label = item.kind === 'subtotal' ? 'this subtotal' : 'this line';
    showConfirm('Delete ' + label + '?', function () {

  function moveLine(subAccountId, sourceId, targetId, before) {
    var found = findSubAccount(subAccountId);
    if (!found) return;
    var arr = found.sub.lines;
    var fromIdx = indexOf(arr, sourceId);
    var toIdx = indexOf(arr, targetId);
    if (fromIdx === -1 || toIdx === -1 || fromIdx === toIdx) return;
    snapshotState();
    var item = arr.splice(fromIdx, 1)[0];
    toIdx = indexOf(arr, targetId);
    var insertAt = before ? toIdx : toIdx + 1;
    arr.splice(insertAt, 0, item);
    save();
    render();
  }

  function nextAccountNum(group) {
    var b = active();
    if (!b) return 1000;
    var groupMax = 0;
    (b.accounts || []).forEach(function (a) {
      if (a.group !== group) return;
      var n = parseInt(a.num, 10);
      if (!isNaN(n) && n > groupMax) groupMax = n;
    });
    if (groupMax > 0) return (Math.floor(groupMax / 100) + 1) * 100;
    if (group === 'OTHER') return 4000;
    var overallMax = 0;
    (b.accounts || []).forEach(function (a) {
      var n = parseInt(a.num, 10);
      if (!isNaN(n) && n > overallMax) overallMax = n;
    });
    if (overallMax === 0) return 1000;
    return (Math.floor(overallMax / 100) + 1) * 100;
  }

  function nextSubAccountNum(account) {
    var parentNum = parseInt(account.num, 10);
    var base = isNaN(parentNum) ? 0 : Math.floor(parentNum / 100) * 100;
    var max = base;
    (account.subAccounts || []).forEach(function (s) {
      var n = parseInt(s.num, 10);
      if (!isNaN(n) && n > max) max = n;
    });
    if (max === base) return base + 1;
    return max + 1;
  }

  function linkGlobal(subAccountId, lineId) {
    var found = findSubAccount(subAccountId);
    if (!found) return;
    var line = null;
    for (var i = 0; i < found.sub.lines.length; i++) {
      if (found.sub.lines[i].id === lineId) { line = found.sub.lines[i]; break; }
    }
    if (!line) return;
    var b = active();
    var names = (b.globals || []).map(function (g) { return g.name; });
    if (!names.length) { window.alert('No globals yet. Add one from the Globals page first.'); return; }
    var current = line.globalId ? ((findGlobalById(line.globalId) || {}).name || '') : '';
    showPrompt({
      title: 'Link to a global',
      help: 'Type the exact name, or leave blank to unlink. Available: ' + names.join(', '),
      value: current,
      inputMode: 'text',
      onSave: function (input) {
        if (input == null) return;
        var t = String(input).trim();
        snapshotState();
        if (!t) {
          line.globalId = null;
        } else {
          var match = (b.globals || []).filter(function (g) { return g.name.toLowerCase() === t.toLowerCase(); })[0];
          if (match) { line.globalId = match.id; var mv = computeGlobalValue(match); line.rate = (typeof mv === 'number') ? mv : (parseFloat(mv) || 0); }
          else { window.alert('No global named "' + t + '" found.'); undoStack.pop(); return; }
        }
        save();
        render();
      }
    });
  }

  function downloadBlob(filename, mimeType, content) {
    var blob = new Blob([content], { type: mimeType });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function csvCell(v) {
    var s = (v == null) ? '' : String(v);
    if (/[",\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  function safeFileName(s) {
    return String(s || 'budget').replace(/[^a-z0-9\-_ ]/gi, '').trim().replace(/\s+/g, '-') || 'budget';
  }

  function timestampFileSuffix() {
    var d = new Date();
    function pad(n) { return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + '-' + pad(d.getMinutes()) + '-' + pad(d.getSeconds());
  }

  function buildExportFileName(b) {
    return safeFileName(b.title) + ' ' + timestampFileSuffix();
  }

  function buildExportRows(b, es) {
    var rows = [];
    rows.push(['Section', 'Group', 'Account #', 'Account Name', 'Sub #', 'Sub Name', 'Description', 'Qty', 'Unit', 'X', 'Rate', 'Amount', 'Notes', 'Fringes']);
    var full = es.detailLevel === 'full' && es.sections.subaccountLines;
    GROUPS.forEach(function (g) {
      var accts = b.accounts.filter(function (a) { return a.group === g.value; });
      if (!accts.length) return;
      accts.forEach(function (a) {
        rows.push(['Account', g.label, a.num, a.name, '', '', '', '', '', '', '', fmtNum(accountSubtotal(a)), '', '']);
        if (!es.sections.accountDetail) return;
        a.subAccounts.forEach(function (s) {
          rows.push(['Sub-account', g.label, a.num, a.name, s.num, s.name, '', '', '', '', '', fmtNum(subAccountTotal(s)), '', '']);
          if (!full) return;
          s.lines.forEach(function (l) {
            if (l.kind === 'subtotal') {
              rows.push(['Subtotal', g.label, a.num, a.name, s.num, s.name, 'Subtotal', '', '', '', '', '', '', '']);
              return;
            }
            var fringeNames = es.sections.fringes ? (l.fringeIds || []).map(function (fid) { var f = findFringe(fid); return f ? f.name : null; }).filter(Boolean).join('; ') : '';
            rows.push(['Line', g.label, a.num, a.name, s.num, s.name, l.description || '', l.qty || '', unitDisplayValue(l) || '', l.x || '', l.rate || '', fmtNum(lineAmount(l)), es.sections.notes ? (l.notes || '') : '', fringeNames]);
          });
        });
      });
      rows.push(['Group Total', g.label, '', '', '', '', '', '', '', '', '', fmtNum(groupTotal(g.value)), '', '']);
    });
    if (es.sections.fringes) rows.push(['Total Fringes', '', '', '', '', '', '', '', '', '', '', fmtNum(totalFringes()), '', '']);
    if (es.sections.contingency) rows.push(['Contingency (' + (b.contingencyPercent || 0) + '%)', '', '', '', '', '', '', '', '', '', '', fmtNum(contingencyAmount()), '', '']);
    rows.push(['Grand Total', '', '', '', '', '', '', '', '', '', '', fmtNum(grandTotal()), '', '']);
    if (es.sections.lockVariance && b.locked) {
      rows.push(['Original Total', '', '', '', '', '', '', '', '', '', '', fmtNum(b.originalTotal || 0), '', '']);
      rows.push(['Variance', '', '', '', '', '', '', '', '', '', '', fmtNum(grandTotal() - (b.originalTotal || 0)), '', '']);
    }
    if (es.sections.fringes && (b.fringes || []).length) {
      rows.push(['', '', '', '', '', '', '', '', '', '', '', '', '', '']);
      rows.push(['Fringe', 'Name', 'Type', 'Rate', '', '', '', '', '', '', '', '', '', '']);
      b.fringes.forEach(function (f) { rows.push(['Fringe', f.name, (f.type === 'percent' ? '% of wages' : 'Flat per line'), (f.type === 'percent' ? f.rate + '%' : fmtNum(f.rate)), '', '', '', '', '', '', '', '', '', '']); });
    }
    if (es.sections.globals && (b.globals || []).length) {
      rows.push(['', '', '', '', '', '', '', '', '', '', '', '', '', '']);
      rows.push(['Global', 'Name', 'Value', '', '', '', '', '', '', '', '', '', '', '']);
      b.globals.forEach(function (g) { rows.push(['Global', g.name, (g.value == null ? '' : g.value), '', '', '', '', '', '', '', '', '', '', '']); });
    }
    if (es.sections.units && (b.units || []).length) {
      rows.push(['', '', '', '', '', '', '', '', '', '', '', '', '', '']);
      rows.push(['Unit', 'Name', 'Plural', '', '', '', '', '', '', '', '', '', '', '']);
      b.units.forEach(function (u) { rows.push(['Unit', u.name, u.plural, '', '', '', '', '', '', '', '', '', '', '']); });

    return rows;

  function fmtNum(n) {
    return (Number(n) || 0).toFixed(2);
  }

  function exportCSV() {
    var b = active();
    if (!b) return;
    var es = ensureExportSettings(b);
    var rows = buildExportRows(b, es);
    var csv = rows.map(function (r) { return r.map(csvCell).join(','); }).join('\r\n');
    downloadBlob(buildExportFileName(b) + '.csv', 'text/csv;charset=utf-8;', csv);
  }

  function exportExcel() {
    var b = active();
    if (!b) return;
    var es = ensureExportSettings(b);
    var rows = buildExportRows(b, es);
    var html = '<html><head><meta charset="UTF-8"></head><body><table border="1">' +
      rows.map(function (r, i) {

      }).join('') + '</table></body></html>';

    return sections;

  function paginatePdfSections(sections, cssClassName, landscape) {
    var staging = document.createElement('div');
    staging.className = cssClassName;
    staging.style.position = 'absolute';
    staging.style.left = '-99999px';
    staging.style.top = '0';
    staging.style.visibility = 'hidden';
    // .pdf-export-root is display:none unless body.pdf-export-mode is set, which
    // only happens after pagination runs. Force it visible for layout via an
    // inline style (wins over the class rule) so getBoundingClientRect() during
    // measurement returns real heights instead of 0.
    staging.style.display = 'block';
    document.body.appendChild(staging);

    // Shrunk well below the theoretical @page-margin printable area (960/720
    // for 0.5in margins) because real browser print pipelines (window.print
    // -> Save as PDF) often reserve additional space beyond the declared
    // @page margin - e.g. their own default margin behavior or a "Headers
    // and footers" option - regardless of our CSS. This leaves a real
    // ~96px (~1in) buffer per page so the footer never spills onto a
    // following sheet.
    var pageWpx = landscape ? 864 : 720;
    var pageHpx = landscape ? 624 : 864;
    var marginPx = 24;
    var safety = 72;
    var contentWidth = pageWpx - marginPx * 2;
    var availableHeight = pageHpx - marginPx * 2 - safety;
    staging.style.width = contentWidth + 'px';
    // Match the background/color/padding overrides that the real export
    // applies via 'body.pdf-export-mode .pdf-export-root' — applied directly
    // as inline styles. Never toggle the body class itself here: the rule
    // 'body.pdf-export-mode > *:not(#pdf-export-overlay)' would hide this
    // staging div (a direct child of body) and silently zero out every
    // row-height measurement below.
    staging.style.background = '#fff';
    staging.style.color = '#111';
    staging.style.padding = '0';

    var pages = [];
    var currentBlocks = [];
    var currentHeight = 0;

    function measure(html) {
      staging.innerHTML = html;
      var el = staging.firstElementChild;
      // Round up: fractional getBoundingClientRect() heights can under-count
      // by a hair versus how the real print engine lays the box out, and
      // those hairline gaps compound over many rows into real overflow.
      return Math.ceil(el ? el.getBoundingClientRect().height : staging.getBoundingClientRect().height);
    }

    function pushPage() {
      if (currentBlocks.length) pages.push(currentBlocks.join(''));
      currentBlocks = [];
      currentHeight = 0;
    }

    sections.forEach(function (sec) {
      if (sec.forceBreak && currentBlocks.length) pushPage();
      if (sec.raw) {
        var rh = measure(sec.raw);
        if (currentBlocks.length && currentHeight + rh > availableHeight) pushPage();
        currentBlocks.push(sec.raw);
        currentHeight += rh;
        if (sec.forceBreakAfter) pushPage();
        return;
      }
      if (sec.title) {
        var th = measure(sec.title);
        if (currentBlocks.length && currentHeight + th > availableHeight) pushPage();
        currentBlocks.push(sec.title);
        currentHeight += th;
      }
      if (sec.table) {
        var headH = measure('<table class="pdf-table"><thead>' + sec.table.headHtml + '</thead></table>');
        var tableBuf = '';
        function openNewTable() {
          tableBuf = '<table class="pdf-table"><thead>' + sec.table.headHtml + '</thead><tbody>';
          currentHeight += headH;
        }
        openNewTable();
        sec.table.rows.forEach(function (rowHtml) {
          var rh2 = measure('<table class="pdf-table"><tbody>' + rowHtml + '</tbody></table>');
          if (currentHeight + rh2 > availableHeight && currentBlocks.length) {
            tableBuf += '</tbody></table>';
            currentBlocks.push(tableBuf);
            pushPage();
            openNewTable();
          }
          tableBuf += rowHtml;
          currentHeight += rh2;
        });
        tableBuf += '</tbody></table>';
        currentBlocks.push(tableBuf);
      }
      if (sec.groupedTable) {
        var gt = sec.groupedTable;
        var gColCount = (gt.headHtml.match(/<th/g) || []).length || 7;
        var gColgroup = '<colgroup>' + Array.from({ length: gColCount }).map(function (_, ci) {
          var w = ci === 0 ? 7 : (ci === 1 ? 30 : (ci === gColCount - 1 ? 20 : Math.floor(43 / Math.max(1, gColCount - 3))));
          return '<col style="width:' + w + '%">';
        }).join('') + '</colgroup>';
        // Flatten all rows and measure them in ONE continuous live layout pass so
        // heights reflect real rendering (measuring many tiny isolated tables
        // independently was found to badly under-measure real row heights).
        var flatRows = [];
        gt.groups.forEach(function (groupRows) {
          groupRows.forEach(function (rowHtml) { flatRows.push(rowHtml); });
        });
        staging.innerHTML = '<table class="pdf-table">' + gColgroup + '<thead>' + gt.headHtml + '</thead><tbody>' + flatRows.join('') + '</tbody></table>';
        var gHeadH = Math.ceil(staging.querySelector('thead').getBoundingClientRect().height);
        var trEls = staging.querySelectorAll('tbody tr');
        var rowHeights = [];
        for (var ri = 0; ri < trEls.length; ri++) rowHeights.push(Math.ceil(trEls[ri].getBoundingClientRect().height));
        staging.innerHTML = '';
        var groupRanges = [];
        var goff = 0;
        gt.groups.forEach(function (groupRows) {
          groupRanges.push({ start: goff, end: goff + groupRows.length });
          goff += groupRows.length;
        });
        var gTableBuf = '';
        var gRowsOnPage = 0;
        function openNewGroupedTable() {
          gTableBuf = '<table class="pdf-table">' + gColgroup + '<thead>' + gt.headHtml + '</thead><tbody>';
          currentHeight += gHeadH;
          gRowsOnPage = 0;
        }
        function flushGroupedTable() {
          gTableBuf += '</tbody></table>';
          currentBlocks.push(gTableBuf);
        }
        openNewGroupedTable();
        gt.groups.forEach(function (groupRows, gi) {
          var range = groupRanges[gi];
          var groupH = 0;
          for (var i = range.start; i < range.end; i++) groupH += rowHeights[i];
          var hasContentOnPage = currentBlocks.length > 0 || gRowsOnPage > 0;
          if (groupH <= availableHeight) {
            if (hasContentOnPage && currentHeight + groupH > availableHeight) {
              flushGroupedTable();
              pushPage();
              openNewGroupedTable();
            }
            for (var i2 = range.start; i2 < range.end; i2++) {
              gTableBuf += flatRows[i2];
              currentHeight += rowHeights[i2];
            }
            gRowsOnPage += groupRows.length;
          } else {
            for (var i3 = range.start; i3 < range.end; i3++) {
              var rh3 = rowHeights[i3];
              var hasRowsOnPage = currentBlocks.length > 0 || gRowsOnPage > 0;
              if (hasRowsOnPage && currentHeight + rh3 > availableHeight) {
                flushGroupedTable();
                pushPage();
                openNewGroupedTable();
              }
              gTableBuf += flatRows[i3];
              currentHeight += rh3;
              gRowsOnPage += 1;
            }
          }
        });
        flushGroupedTable();
      }
      if (sec.forceBreakAfter) pushPage();
    });
    pushPage();
    document.body.removeChild(staging);
    return pages;
  }

  function parseCsvText(text) {
    var rows = [];
    var row = [];
    var cur = '';
    var inQuotes = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { cur += '"'; i++; } else { inQuotes = false; }
        } else { cur += c; }
      } else if (c === '"') {
        inQuotes = true;
      } else if (c === ',') {
        row.push(cur); cur = '';
      } else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(cur); cur = '';
        rows.push(row); row = [];
      } else { cur += c; }
    }
    if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
    return rows.filter(function (r) { return r.length && r.some(function (c) { return c !== ''; }); });
  }

  function importCSVFile() {
    var input = document.getElementById('import-csv-input');
    if (!input || !input.files || !input.files[0]) { window.alert('Choose a .csv file first.'); return; }
    var file = input.files[0];
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var rows = parseCsvText(String(reader.result));
        if (!rows.length) { window.alert('That CSV file looks empty.'); return; }
        var header = rows[0].map(function (h) { return h.trim().toLowerCase(); });
        var idx = {
          group: header.indexOf('group'), accNum: header.indexOf('account #'), accName: header.indexOf('account name'),
          subNum: header.indexOf('sub #'), subName: header.indexOf('sub name'), desc: header.indexOf('description'),
          qty: header.indexOf('qty'), unit: header.indexOf('unit'), x: header.indexOf('x'), rate: header.indexOf('rate')
        };
        if (idx.accName < 0 || idx.subName < 0) { window.alert('CSV must include at least Account Name and Sub Name columns (matching an exported CSV).'); return; }
        var newBudget = { id: uid(), title: 'Imported CSV Budget', accounts: [], contingencyPercent: 0, currency: 'USD', globals: [], fringes: [], units: DEFAULT_UNITS.map(function (u) { return { name: u.name, plural: u.plural }; }) };
        var accMap = {};
        var subMap = {};
        for (var r = 1; r < rows.length; r++) {
          var row = rows[r];
          var groupRaw = (idx.group >= 0 ? row[idx.group] : '') || 'ATL';
          var group = /other/i.test(groupRaw) ? 'OTHER' : /btl\s*post/i.test(groupRaw) ? 'BTLPost' : /btl/i.test(groupRaw) ? 'BT' : 'ATL';
          var accName = row[idx.accName];
          var subName = row[idx.subName];
          if (!accName) continue;
          var accKey = group + '|' + accName;
          if (!accMap[accKey]) {
            var acc = { id: uid(), group: group, num: (idx.accNum >= 0 ? row[idx.accNum] : '') || '', name: accName, subAccounts: [] };
            accMap[accKey] = acc;
            newBudget.accounts.push(acc);
          }
          if (!subName) continue;
          var subKey = accKey + '|' + subName;
          if (!subMap[subKey]) {
            var sub = { id: uid(), num: (idx.subNum >= 0 ? row[idx.subNum] : '') || '', name: subName, lines: [] };
            subMap[subKey] = sub;
            accMap[accKey].subAccounts.push(sub);
          }
          var desc = idx.desc >= 0 ? row[idx.desc] : '';
          if (!desc) continue;
          subMap[subKey].lines.push({
            id: uid(), kind: 'line', description: desc,
            qty: idx.qty >= 0 ? row[idx.qty] : '', unit: idx.unit >= 0 ? row[idx.unit] : '',
            x: idx.x >= 0 ? row[idx.x] : 1, rate: idx.rate >= 0 ? row[idx.rate] : 0
          });
        }
        if (!newBudget.accounts.length) { window.alert('No accounts could be parsed from that CSV.'); return; }
        snapshotState();
        state.budgets.push(newBudget);
        state.activeBudgetId = newBudget.id;
        view = { mode: 'sheet' };
        save();
        render();
        closeImportPanel();
      } catch (e) {
        window.alert('Could not parse that CSV file.');
      }
    };
    reader.readAsText(file);
  }

  var pendingMMBImport = null;

  function defaultGroupForMMBCategoryNumber(num) {
    var n = parseInt(num, 10);
    if (isNaN(n)) return 'BT';
    if (n < 2000) return 'ATL';
    if (n < 3200) return 'BT';
    if (n < 4000) return 'BTLPost';
    return 'OTHER';
  }

  function mmbTextOf(el, tag) {
    var els = el.getElementsByTagName(tag);
    return els.length ? (els[0].textContent || '').trim() : '';
  }

  function mmbChildCodes(el, wrapperTag, itemTag) {
    var wrap = el.getElementsByTagName(wrapperTag);
    if (!wrap.length) return [];
    var items = wrap[0].getElementsByTagName(itemTag);
    var out = [];
    for (var i = 0; i < items.length; i++) {
      var v = (items[i].textContent || '').trim();
      if (v) out.push(v);
    }
    return out;
  }

  function parseMMBXML(text) {
    var cleaned = text.replace(/ xmlns="[^"]*"/, '');
    var doc = new DOMParser().parseFromString(cleaned, 'text/xml');
    var perr = doc.getElementsByTagName('parsererror');
    if (perr.length) throw new Error('Invalid XML file.');
    var categoryEls = doc.getElementsByTagName('category');
    var categories = [];
    for (var i = 0; i < categoryEls.length; i++) {
      var c = categoryEls[i];
      categories.push({ cID: mmbTextOf(c, 'cID'), num: mmbTextOf(c, 'cNumber'), name: mmbTextOf(c, 'cDescription') });
    }
    var accountEls = doc.getElementsByTagName('account');
    var accounts = [];
    for (var j = 0; j < accountEls.length; j++) {
      var a = accountEls[j];
      accounts.push({ categoryID: mmbTextOf(a, 'categoryID'), aID: mmbTextOf(a, 'aID'), num: mmbTextOf(a, 'aNumber'), name: mmbTextOf(a, 'aDescription') });
    }
    var detailEls = doc.getElementsByTagName('detail');
    var details = [];
    for (var k = 0; k < detailEls.length; k++) {
      var d = detailEls[k];
      details.push({
        accountID: mmbTextOf(d, 'accountID'),
        description: mmbTextOf(d, 'dDescription'),
        qty: mmbTextOf(d, 'dAmount'),
        unit: mmbTextOf(d, 'dUnit'),
        x: mmbTextOf(d, 'dX'),
        rate: mmbTextOf(d, 'dRate'),
        fringeCodes: mmbChildCodes(d, 'dFringes', 'dFringe'),
        groupCodes: mmbChildCodes(d, 'dGroups', 'dGroup'),
        globalCodes: mmbChildCodes(d, 'dGlobalsUsed', 'dGlobalUsed')
      });
    }
    if (!categories.length && !accounts.length) throw new Error('No Movie Magic categories/accounts found in this file.');
    return { categories: categories, accounts: accounts, details: details };
  }

  function openMMBImportReview(parsed, fileLabel) {
    var contingencyCatId = null;
    var contingencyPercent = 0;
    parsed.categories.forEach(function (c) {
      if (/contingency/i.test(c.name)) {
        contingencyCatId = c.cID;
        var m = /([\d.]+)\s*%/.exec(c.name);
        if (m) contingencyPercent = parseFloat(m[1]) || 0;
      }
    });
    var fringeCodes = {}, groupCodes = {}, globalCodes = {}, unitCodes = {};
    parsed.details.forEach(function (d) {
      d.fringeCodes.forEach(function (code) { fringeCodes[code] = true; });
      d.groupCodes.forEach(function (code) { groupCodes[code] = true; });
      d.globalCodes.forEach(function (code) { globalCodes[code] = true; });
      if (d.unit) unitCodes[d.unit] = true;
    });
    pendingMMBImport = {
      fileLabel: fileLabel,
      parsed: parsed,
      contingencyCatId: contingencyCatId,
      contingencyPercent: contingencyPercent,
      categoryGroups: {},
      fringeNames: {},
      fringeRates: {},
      groupNames: {},
      groupColors: {},
      globalNames: {},
      globalValues: {},
      unitPlurals: {},
      unitHours: {}
    };
    parsed.categories.forEach(function (c) {
      if (c.cID === contingencyCatId) return;
      pendingMMBImport.categoryGroups[c.cID] = defaultGroupForMMBCategoryNumber(c.num);
    });
    Object.keys(fringeCodes).forEach(function (code) { pendingMMBImport.fringeNames[code] = code; pendingMMBImport.fringeRates[code] = 0; });
    Object.keys(groupCodes).forEach(function (code, i) { pendingMMBImport.groupNames[code] = code; pendingMMBImport.groupColors[code] = GROUP_COLORS[i % GROUP_COLORS.length]; });
    Object.keys(globalCodes).forEach(function (code) { pendingMMBImport.globalNames[code] = code; pendingMMBImport.globalValues[code] = ''; });
    Object.keys(unitCodes).forEach(function (code) { pendingMMBImport.unitPlurals[code] = code; pendingMMBImport.unitHours[code] = ''; });
    renderMMBReviewModal();
    var modal = document.getElementById('mmb-review-modal');
    var backdrop = document.getElementById('mmb-review-backdrop');
    if (modal) modal.classList.add('open');
    if (backdrop) backdrop.classList.add('open');
  }

  function closeMMBReviewModal() {
    var modal = document.getElementById('mmb-review-modal');
    var backdrop = document.getElementById('mmb-review-backdrop');
    if (modal) modal.classList.remove('open');
    if (backdrop) backdrop.classList.remove('open');
    pendingMMBImport = null;
  }

  function renderMMBReviewModal() {
    var body = document.getElementById('mmb-review-body');

    }).join('');
    function fringeRows(names, rates) {

          '<span class="mmb-code-suffix">%</span>' +

        var swatches = GROUP_COLORS.map(function (c) {

        }).join('');
        return '<div class="mmb-code-row"><span class="mmb-code">' + esc(code) + '</span>' +
          '<input type="text" class="mmb-group-name" data-code="' + esc(code) + '" value="' + esc(names[code]) + '" placeholder="Name">' +
          '<span class="mmb-swatch-row">' + swatches + '</span>' +
          '</div>';
      }).join('');
    }
    function globalRows(names, values) {
      var keys = Object.keys(names);
      if (!keys.length) return '<p class="hint">None found.</p>';
      return keys.map(function (code) {
        return '<div class="mmb-code-row"><span class="mmb-code">' + esc(code) + '</span>' +
          '<input type="text" class="mmb-global-name" data-code="' + esc(code) + '" value="' + esc(names[code]) + '" placeholder="Name">' +
          '<input type="text" class="mmb-global-value" data-code="' + esc(code) + '" value="' + esc(values[code] || '') + '" placeholder="Value">' +
          '</div>';
      }).join('');
    }
    function unitRows(plurals, hours) {
      var keys = Object.keys(plurals);
      if (!keys.length) return '<p class="hint">None found.</p>';
      return keys.map(function (code) {
        return '<div class="mmb-code-row"><span class="mmb-code">' + esc(code) + '</span>' +
          '<input type="text" class="mmb-unit-plural" data-code="' + esc(code) + '" value="' + esc(plurals[code] || code) + '" placeholder="Plural (e.g. Weeks)">' +
          '<input type="text" class="mmb-unit-hours" data-code="' + esc(code) + '" value="' + esc(hours[code] || '') + '" placeholder="Hours (optional)" style="max-width:100px;flex:none;">' +
          '</div>';

    body.innerHTML =

      ' before importing <b>' + esc(p.fileLabel) + '</b> as a new budget.</p>' +
      '<table class="mmb-review-table"><thead><tr><th>#</th><th>Category</th><th>Group</th></tr></thead><tbody>' + rows + '</tbody></table>' +
      '<h4 class="mmb-review-h4">Fringe codes found &mdash; set a starting rate</h4>' + fringeRows(p.fringeNames, p.fringeRates) +
      '<h4 class="mmb-review-h4">Group codes found &mdash; choose a color</h4>' + groupRows(p.groupNames, p.groupColors) +
      '<h4 class="mmb-review-h4">Global codes found &mdash; set a starting value</h4>' + globalRows(p.globalNames, p.globalValues) +
      '<h4 class="mmb-review-h4">Units found &mdash; set plural form and hour equivalence</h4>' + unitRows(p.unitPlurals, p.unitHours);
  }

  function confirmMMBImport() {
    var p = pendingMMBImport;
    if (!p) return;
    var parsed = p.parsed;
    var fringeIdByCode = {}, groupIdByCode = {}, globalIdByCode = {};
    var fringes = Object.keys(p.fringeNames).map(function (code) {
      var id = uid(); fringeIdByCode[code] = id;
      var rate = amountNumber(p.fringeRates[code]);
      return { id: id, name: p.fringeNames[code] || code, type: 'percent', rate: isNaN(rate) ? 0 : rate };
    });
    var groups = Object.keys(p.groupNames).map(function (code, i) {
      var id = uid(); groupIdByCode[code] = id;
      return { id: id, name: p.groupNames[code] || code, color: p.groupColors[code] || GROUP_COLORS[i % GROUP_COLORS.length] };
    });
    var globals = Object.keys(p.globalNames).map(function (code) {
      var id = uid(); globalIdByCode[code] = id;
      return { id: id, name: p.globalNames[code] || code, value: p.globalValues[code] || '' };
    });
    var importedUnitNames = {};
    var units = DEFAULT_UNITS.map(function (u) { return { name: u.name, plural: u.plural }; });
    units.forEach(function (u) { importedUnitNames[u.name.toLowerCase()] = true; });
    Object.keys(p.unitPlurals).forEach(function (code) {
      if (importedUnitNames[code.toLowerCase()]) return;
      var hoursVal = parseFloat(p.unitHours[code]);
      units.push({ name: code, plural: p.unitPlurals[code] || code, hours: isNaN(hoursVal) ? null : hoursVal });
      importedUnitNames[code.toLowerCase()] = true;
    });
    var accountByCatId = {};
    var accounts = [];
    parsed.categories.forEach(function (c) {
      if (c.cID === p.contingencyCatId) return;
      var acc = { id: uid(), num: c.num, name: c.name, group: p.categoryGroups[c.cID] || 'BT', subAccounts: [], fringeIds: [] };
      accountByCatId[c.cID] = acc;
      accounts.push(acc);
    });
    var subByAccId = {};
    parsed.accounts.forEach(function (a) {
      var parentAcc = accountByCatId[a.categoryID];
      if (!parentAcc) return;
      var sub = { id: uid(), num: a.num, name: a.name, lines: [], groupIds: [] };
      subByAccId[a.aID] = sub;
      parentAcc.subAccounts.push(sub);
    });
    parsed.details.forEach(function (d) {
      var sub = subByAccId[d.accountID];
      if (!sub) return;
      var fIds = d.fringeCodes.map(function (code) { return fringeIdByCode[code]; }).filter(Boolean);
      var gIds = d.groupCodes.map(function (code) { return groupIdByCode[code]; }).filter(Boolean);
      sub.lines.push({
        id: uid(), kind: 'line', num: '', description: d.description || '',
        qty: d.qty || '', unit: d.unit || '', x: d.x || 1, rate: d.rate || 0,
        actual: '', fringeIds: fIds, groupIds: gIds, raw: {}
      });
    });
    var newBudget = {
      id: uid(),
      title: (p.fileLabel || 'Imported MMB Budget').replace(/\.xml$/i, ''),
      accounts: accounts,
      contingencyPercent: p.contingencyPercent || 0,
      currency: 'USD',
      globals: globals,
      fringes: fringes,
      units: units,
      groups: groups,
      locked: false,
      originalTotal: null,
      showActuals: false
    };
    snapshotState();
    state.budgets.push(newBudget);
    state.activeBudgetId = newBudget.id;
    view = { mode: 'sheet' };
    save();
    render();
    closeMMBReviewModal();
    closeImportPanel();
  }

    if (ok) ok.textContent = actionLabel || (/^(?:Permanently )?(?:Delete|Remove)/i.test(message) ? 'Delete' : /^Cancel/i.test(message) ? 'Confirm cancellation' : /^Finalize/i.test(message) ? 'Finalize cost' : /^Reopen/i.test(message) ? 'Reopen' : /^Close/i.test(message) ? 'Close line' : /^Re-lock/i.test(message) ? 'Re-lock Original' : 'Confirm');

    var found = findSubAccount(subAccountId);

    found.sub.lines.forEach(function (l) {

      if (!l.fringeIds) l.fringeIds = [];
      ids.forEach(function (fid) { if (l.fringeIds.indexOf(fid) === -1) l.fringeIds.push(fid); });

    save();
    render();

  function pmTimelineHTML(){const cf=pmCF(),fields=pmMilestones().filter(m=>!cf.milestones.some(x=>x.id===m.id)),hasSaved=!!cf.timelineSavedAt||Object.values(cf.phases).some(Boolean)||!!cf.openingDate||!!cf.openingCash,editing=pm.timelineEditing??!hasSaved;

  duplicateBudget=function(id){const src=findBudget(id);if(!src||pm.busy)return;showConfirm('Duplicate '+src.title+'? This copies invoices, paid/refund history and documents—not a fresh unpaid estimate. Vendor contacts remain shared; document originals are copied independently. The locked Original Total is cleared.',async()=>{if(pm.busy)return;pm.busy=true;const stored=[],before=JSON.stringify(state);let mutated=false;try{const copy=JSON.parse(JSON.stringify(src));for(const d of copy.cashflow?.documents||[]){const blob=await pmBlob(d);d.key=pmId();await pmStore('put',d.key,blob);stored.push(d.key);}if(before!==JSON.stringify(state))throw Error('The workspace changed during duplication. Try again.');snapshotState();mutated=true;copy.id=uid();const m=/^(.*)\s+v(\d+)$/.exec(src.title);copy.title=m?m[1]+' v'+(Number(m[2])+1):src.title+' v2';copy.locked=false;copy.originalTotal=null;state.budgets.splice(state.budgets.findIndex(b=>b.id===id)+1,0,copy);state.activeBudgetId=copy.id;view={mode:'sheet'};save();render();}catch(e){if(mutated)state=JSON.parse(before);for(const key of stored)await pmStore('delete',key);window.alert('Duplicate stopped: '+e.message+' The original budget is unchanged.');}finally{pm.busy=false;}},'Duplicate');};

  const clarityOldDownloads=pmDownloadsHTML;pmDownloadsHTML=function(){const section=`<section class="pm-download-section" aria-labelledby="clarity-workspace-title"><h3 id="clarity-workspace-title">Whole-workspace backup</h3><p>All ${state.budgets.length} budgets, folders, every vendor contact (including unassigned/archived), payment history and original documents. No payment/date/privacy filters apply.</p><div class="pm-download-actions">${pmBtn('clarity-workspace-backup','Back up all budgets & contacts…')}</div><p class="pm-note">A sensitive .nlb-workspace.json file. Import it from the sidebar Import panel to add copies without replacing existing work. This is a backup, not a sharing report.</p></section>`;return clarityOldDownloads().replace('</section></div>','</section>'+section+'</div>');};
  const clarityOldAction=pmAction;pmAction=async function(action,id){if(action==='clarity-workspace-backup'){if(pm.busy)return;pm.busy=true;const btn=document.querySelector('[data-pm=clarity-workspace-backup]');if(btn){btn.disabled=true;btn.textContent='Preparing workspace backup…';}try{await clarityWorkspaceBackup();}finally{pm.busy=false;}return;}return clarityOldAction(action,id);};
  function clarityCloseoutHTML(){const b=active(),rows=PC.lines(b),ss=rows.map(r=>LC.status(b,r.line.id,pmCalc)),unconfirmed=rows.filter(r=>!PC.meta(b,r.line.id)?.confirmed&&!PC.meta(b,r.line.id)?.closed&&!PC.meta(b,r.line.id)?.lifecycleClosed).length,missing=LC.ensure(b).ledger.filter(e=>e.kind==='payment'&&LC.missingReceipts(b,e.allocations[0]?.lineId).some(x=>x.id===e.id)).length,legacy=rows.filter(r=>{const m=PC.meta(b,r.line.id)||{};return(m.openingBase||m.openingFringe)&&!m.openingReviewed;}).length,uns=PC.sum(PC.unscheduled(b,pmCalc),r=>r.base+r.fringe);return `<section class="lc-section clarity-closeout"><h3>Production closeout review</h3><p class="pm-note">Whole-budget checks, independent of the filters above. Review these figures against your records; they do not reconcile your bank.</p><dl><div><dt>Still owed</dt><dd>${pmAmount(PC.sum(ss,s=>s.owed))}</dd></div><div><dt>Expected refunds</dt><dd>${pmAmount(PC.sum(ss,s=>s.returns))}</dd></div><div><dt>Not scheduled yet</dt><dd>${pmAmount(uns)}</dd></div><div><dt>Payments missing receipts</dt><dd>${missing}</dd></div><div><dt>Costs not confirmed/finalized</dt><dd>${unconfirmed}</dd></div><div><dt>Legacy Actuals needing review</dt><dd>${legacy}</dd></div></dl><p class="pm-note">Then verify funding, close eligible lines, review sensitive files, download the binder/reports and keep an external backup. Not scheduled yet measures unallocated/undated outgoing requirements; undated refunds/funding need separate review.</p><button type="button" class="btn btn-ghost" data-action="clarity-closeout-help">Open closeout checklist</button></section>`;}
  const clarityOldPayments=pmPaymentsHTML;pmPaymentsHTML=function(){const html=clarityOldPayments();return lcTarget()?html:html+clarityCloseoutHTML();};
  document.addEventListener('click',e=>{const btn=e.target.closest('[data-help-group],[data-action="clarity-closeout-help"]');if(!btn)return;e.preventDefault();if(btn.dataset.action==='clarity-closeout-help'){pmClose();openHelpPanel();renderHelpPanel('Production closeout checklist');}else{renderHelpPanel('');document.getElementById(btn.dataset.helpGroup)?.scrollIntoView({block:'start'});}},true);

  window.NLBPaymentApp.exportRows=(all=false)=>pmExportRows(all);

  function spaceSnapshot(){const x={};for(const k of spaceFields)if(pm[k]!==undefined)x[k]=spaceClone(pm[k]);x.form=pm.form?spaceClone(pm.form):null;const body=document.querySelector('#pm-layer .pm-body');x.scroll=body?.scrollTop||0;if(x.form){const form=body?.querySelector('form[data-pm-form="editor"]');if(form){x.form.draft=spaceDraft(form);if(x.form.kind==='lc-invoice'&&x.form.draft.lcTarget)x.form.value.target=lcParseTarget(x.form.draft.lcTarget[0]);}}return x;}

  function spaceTrack(){if(spaceNav.hold||spaceNav.restoring||document.getElementById('pm-layer')?.hidden)return;if(spaceNav.budget!==active()?.id){spaceNav.budget=active()?.id;spaceNav.entries=[];spaceNav.pos=-1;}const x=spaceSnapshot(),old=spaceNav.entries[spaceNav.pos];if(!old||spaceKey(old)!==spaceKey(x)){spaceNav.entries=spaceNav.entries.slice(0,spaceNav.pos+1);spaceNav.entries.push(x);if(spaceNav.entries.length>50)spaceNav.entries.shift();spaceNav.pos=spaceNav.entries.length-1;}else spaceNav.entries[spaceNav.pos]=x;}
  function spaceForget(postId){if(!postId)return;for(const x of spaceNav.entries)if(x.form?.postId===postId)x.form=null;}
  function spaceCrumb(label,action,id,current=false){return current?`<span aria-current="page">${esc(label)}</span>`:`<button type="button" data-pm="${action}" data-id="${esc(id||'')}">${esc(label)}</button>`;}
  function spaceBar(){const layer=document.getElementById('pm-layer');if(!layer||layer.hidden)return;let bar=layer.querySelector('.space-nav');if(!bar){bar=document.createElement('nav');bar.className='space-nav';bar.setAttribute('aria-label','Workspace navigation');layer.querySelector('.pm-tabs').after(bar);}const pieces=[spaceCrumb(active().title,'space-budget'),spaceCrumb('Payments & Timeline','space-root')],target=lcTarget();pieces.push(spaceCrumb(spaceTabs[pm.tab]||pm.tab,'space-section',pm.tab,!target&&!pm.form));if(pm.tab==='payments'&&target){const r=target.kind==='line'?pmRow(target.id):target.kind==='sub'?LC.rows(active(),target)[0]:null;const account=r?.account||(target.kind==='account'?LC.entity(active(),target):null),sub=r?.sub||(target.kind==='sub'?LC.entity(active(),target):null);if(account)pieces.push(spaceCrumb(account.num+' '+account.name,'space-target','account:'+account.id,target.kind==='account'&&!pm.form));if(sub)pieces.push(spaceCrumb(sub.num+' '+sub.name,'space-target','sub:'+sub.id,target.kind==='sub'&&!pm.form));if(target.kind==='line')pieces.push(spaceCrumb(r?.line.description||'Untitled line','space-target','line:'+target.id,!pm.form));}
 if(pm.form){const f=pm.form,name=f.value?.internalName||f.value?.originalName||f.kind==='vendor'&&f.value?.name;if(name)pieces.push(spaceCrumb(name,f.kind==='vendor'?'space-vendor':'space-document',f.value.id));pieces.push(spaceCrumb(spaceFormNames[f.kind]||'Edit','',null,true));}bar.innerHTML=`<div class="space-arrows"><button type="button" data-pm="space-back" aria-label="Back to previous space"${spaceNav.pos<=0?' disabled aria-description="No previous space in this open workspace."':''}>←</button><button type="button" data-pm="space-forward" aria-label="Forward to next space"${spaceNav.pos>=spaceNav.entries.length-1?' disabled aria-description="No next space in this open workspace."':''}>→</button></div><ol class="space-crumbs">${pieces.map(p=>'<li>'+p+'</li>').join('')}</ol>`;}
  function spaceSanitize(x){const cf=LC.ensure(active());if(x.line&&!pmRow(x.line)){x.line='';x.parent=null;x.form=null;}if(x.parent&&!LC.entity(active(),x.parent)){x.parent=null;x.form=null;}if(x.account&&!active().accounts.some(a=>a.id===x.account))x.account='';if(x.sub&&!active().accounts.some(a=>a.subAccounts.some(s=>s.id===x.sub)))x.sub='';const f=x.form;if(f?.postId&&cf.ledger.some(e=>e.id===f.postId))x.form=null;if(f&&['doc','preview'].includes(f.kind)&&!cf.documents.some(d=>d.id===f.value?.id))x.form=null;if(f?.kind==='vendor'&&f.value?.id&&!pmVendor(f.value.id))x.form=null;return x;}
  async function spaceMove(delta){if(spaceNav.restoring||spaceNav.hold||pm.busy)return;const pos=spaceNav.pos+delta;if(pos<0||pos>=spaceNav.entries.length)return;spaceSave();spaceNav.restoring=true;try{const x=spaceSanitize(spaceClone(spaceNav.entries[pos]));if(pm.preview)URL.revokeObjectURL(pm.preview);pm.preview=null;for(const k of spaceFields)pm[k]=x[k];pm.form=x.form;pm.downloadError='';pm.notice='';if(pm.form?.kind==='preview'){const d=pmCF().documents.find(d=>d.id===pm.form.value.id);if(d)pm.preview=URL.createObjectURL(await pmBlob(d));else pm.form=null;}spaceNav.pos=pos;pmRender();const body=document.querySelector('#pm-layer .pm-body');if(body)body.scrollTop=x.scroll||0;}finally{spaceNav.restoring=false;spaceBar();}}
  const spaceOldRender=pmRenderBody;pmRenderBody=function(){if(!spaceNav.restoring)spaceSave();spaceOldRender();spaceTrack();spaceBar();};
  const spaceOldOpen=pmOpen;pmOpen=function(...args){const fresh=!document.getElementById('pm-layer')||document.getElementById('pm-layer').hidden||spaceNav.budget!==active()?.id;if(fresh){spaceNav.budget=active()?.id;spaceNav.entries=[];spaceNav.pos=-1;}else spaceSave();spaceOldOpen(...args);};

  const spaceOldCommit=pmCommit;pmCommit=function(...args){const postId=pm.form?.postId;const result=spaceOldCommit(...args);if(result)spaceForget(postId);spaceBar();return result;};
  const spaceOldAction=pmAction;pmAction=async function(action,id){if(spaceNav.restoring)return;if(action==='space-back')return spaceMove(-1);if(action==='space-forward')return spaceMove(1);spaceSave();const postId=pm.form?.postId;spaceNav.hold++;try{if(action==='space-budget')return pmClose();if(action==='space-target')return lcOpen(lcParseTarget(id));if(action==='space-document')return await spaceOldAction('edit-doc',id);if(action==='space-vendor')return await spaceOldAction('edit-vendor',id);if(action==='space-root'||action==='space-section'){pm.form=null;if(pm.preview)URL.revokeObjectURL(pm.preview);pm.preview=null;pm.tab=action==='space-root'?'payments':id;pm.parent=null;pm.line='';pm.account='';pm.sub='';pm.vendor='';return pmRender();}return await spaceOldAction(action,id);}finally{spaceNav.hold--;if(action==='cancel-editor')spaceForget(postId);spaceTrack();spaceBar();}};
  function supportPlaceholderHTML(){return `<section class="support-placeholder" aria-labelledby="support-coffee-title"><h3 id="support-coffee-title">Buy the developers a coffee</h3><p>NO LONGER BUDGET is built to make production budgeting a little easier. If it’s helped you and your budget allows, add an extra coffee to your crafty line for us.</p><p>Support is appreciated, but never expected. Contribute once, regularly, or never—the app works exactly the same either way.</p><p id="support-inactive-status" class="support-status">Not active at the moment</p><button type="button" class="btn btn-ghost" disabled aria-describedby="support-inactive-status" title="Support payments are not active. No payment page will open.">Buy us a coffee</button></section>`;}

  // Dedicated payment-list PDF styling; the budget PDF, binder and calendar renderers are unchanged.
  pmPaymentPdf=async function(){const pdf=await PDFLib.PDFDocument.create();pdf.setTitle(active().title+' — Payments & Timeline');pdf.registerFontkit(window.fontkit);const font=await pdf.embedFont(Uint8Array.from(atob(window.NLB_FONT_B64),c=>c.charCodeAt(0)),{subset:true}),W=612,H=792,M=42,inner=W-M*2;let page,y,pageStartY;const pages=[];function wrap(text,size,width=inner-20){const lines=[];let line='';for(let word of String(text??'').replace(/[\r\n]+/g,' ').split(/\s+/)){if(font.widthOfTextAtSize(line?line+' '+word:word,size)>width&&line){lines.push(line);line='';}while(font.widthOfTextAtSize(word,size)>width&&word.length){let n=1;while(n<word.length&&font.widthOfTextAtSize(word.slice(0,n+1),size)<=width)n++;lines.push(word.slice(0,n));word=word.slice(n);}line+=(line?' ':'')+word;}if(line)lines.push(line);return lines.length?lines:[''];}
 function newPage(){page=pdf.addPage([W,H]);pages.push(page);y=H-M;page.drawText('Payments & Timeline',{x:M,y,size:17,font,color:PDFLib.rgb(.08,.08,.08)});y-=24;const title=wrap(active().title,12,inner);for(const line of title.slice(0,3)){page.drawText(line,{x:M,y,size:12,font});y-=16;}if(title.length>3){page.drawText('(Long budget title shortened in this page header)',{x:M,y,size:9,font});y-=14;}page.drawText('Currency '+(active().currency||'USD')+' · Selected allocations · Planned records and paid history',{x:M,y,size:9,font,color:PDFLib.rgb(.3,.3,.3)});y-=20;page.drawLine({start:{x:M,y},end:{x:W-M,y},thickness:.6,color:PDFLib.rgb(.7,.7,.7)});y-=14;pageStartY=y;}
 newPage();const records=pmExportRows().slice(1);if(!records.length){page.drawText('No payment records match this selection.',{x:M,y,size:11,font});}
 records.forEach((r,index)=>{const data=[{text:r[0]+' · '+r[1]+' · '+r[8],size:9},{text:r[2],size:12},{text:r[3],size:10},{text:'Base '+pmAmount(r[5])+'  +  Fringes '+pmAmount(r[6])+'  =  Total '+pmAmount(r[7]),size:11},{text:'Vendor: '+r[4],size:10}];for(const [col,label] of [[11,'Lifecycle / invoice'],[12,'Payment recipient'],[13,'Merchant'],[14,'Evidence'],[10,'Notes']])if(r[col])data.push({text:label+': '+r[col],size:10});if(Math.abs(Number(r[9])-Number(r[7]))>.009)data.push({text:(r[1]==='Installment'?'Whole installment remaining: ':'Whole record amount: ')+pmAmount(r[9]),size:9});const lines=data.flatMap(item=>wrap(item.text,item.size).map(text=>({text,size:item.size,height:item.size+4})));const totalHeight=lines.reduce((sum,line)=>sum+line.height,0)+18;if(totalHeight<=pageStartY-M-22&&totalHeight>y-M-22)newPage();let offset=0;while(offset<lines.length){if(y<M+70)newPage();if(offset){page.drawText('Record continued: '+String(r[2]).slice(0,68),{x:M+10,y:y-12,size:9,font,color:PDFLib.rgb(.3,.3,.3)});y-=25;}const capacity=y-M-22;let used=0,end=offset;while(end<lines.length&&used+lines[end].height<=capacity){used+=lines[end].height;end++;}if(end===offset){newPage();continue;}const boxHeight=used+18;page.drawRectangle({x:M,y:y-boxHeight,width:inner,height:boxHeight,color:index%2===0?PDFLib.rgb(.955,.955,.955):PDFLib.rgb(1,1,1)});page.drawLine({start:{x:M,y:y-boxHeight},end:{x:W-M,y:y-boxHeight},thickness:.45,color:PDFLib.rgb(.76,.76,.76)});let baseline=y-11;for(const line of lines.slice(offset,end)){baseline-=line.size;page.drawText(line.text,{x:M+10,y:baseline,size:line.size,font,color:PDFLib.rgb(.08,.08,.08)});baseline-=4;}y-=boxHeight+8;offset=end;if(offset<lines.length)newPage();}});
 pages.forEach((p,i)=>p.drawText('Snapshot only · Review records before sharing · '+(i+1)+' / '+pages.length,{x:M,y:23,size:9,font,color:PDFLib.rgb(.35,.35,.35)}));downloadBlob(buildExportFileName(active())+' Payments.pdf','application/pdf',await pdf.save());};
