<style>
  :root {
    --page: #EBEBEB;
    --canvas: #FFFFFF;
    --surface-2: #EBEBEB;
    --border: #D9D9D9;
    --row-alt: rgba(0, 0, 0, 0.035);
    --text: #0B0B0B;
    --text-2: #3D3D3D;
    --accent: #F4B63F;
    --accent-soft: #FBF3E2;
    --red: #E56458;
    --subtotal-bg: #DCE9F7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0B0B0B;
      --canvas: #242323;
      --surface-2: #3D3D3D;
      --border: rgba(255, 255, 255, 0.15);
      --row-alt: rgba(255, 255, 255, 0.045);
      --text: #FFFFFF;
      --text-2: rgba(255, 255, 255, 0.65);
      --accent: #F4B63F;
      --accent-soft: rgba(244, 182, 63, 0.15);
      --red: #E97366;
      --subtotal-bg: rgba(90, 140, 210, 0.22);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--page);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  .layout { display: flex; min-height: 100vh; }
  .sidebar {
    width: 450px;
    flex: none;
    position: fixed;
    top: 0;
    left: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--canvas);
    border-right: 1px solid var(--border);
    z-index: 20;
    transition: width .15s ease;
  }
  body.sidebar-collapsed .sidebar { width: 0; border-right: none; overflow: hidden; }
  .sidebar-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 24px 16px 16px; }
  .sidebar-head { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; margin-top: 5px; margin-bottom: 5px; min-height: 32px; }
  .sidebar-head-seal { display: inline-flex; width: 115px; height: 115px; border-radius: 26px; }
  .sidebar-head-seal img { width: 100%; height: 100%; display: block; border-radius: 8px; }
  .save-indicator { font-size: 11px; color: var(--text-2); opacity: .7; text-align: left; margin-bottom: 6px; white-space: nowrap; }
  .app-version-inline { font-size: 11px; color: var(--text-2); opacity: .65; margin-left: 8px; white-space: nowrap; align-self: center; }
  .sidebar-head #sidebar-toggle-btn { position: absolute; right: 0; top: 50%; transform: translateY(-50%); }
  .main { flex: 1; min-width: 0; padding: 94px 32px 110px; margin-left: 450px; transition: margin-left .15s ease; }
  body.sidebar-collapsed .main { margin-left: 0; }
  .brand { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 900; font-stretch: normal; font-size: 18px; letter-spacing: 0.01em; margin: 0; white-space: nowrap; text-align: center; width: 100%; }
  .sidebar-footer { position: static; flex: none; display: flex; justify-content: center; padding: 16px 16px 24px; border-top: 1px solid var(--border); }
  .sidebar-footer-seal { display: inline-flex; width: 36px; height: 36px; border-radius: 8px; opacity: 0.92; transition: opacity .15s ease, transform .15s ease; }
  .sidebar-footer-seal:hover { opacity: 1; transform: scale(1.04); }
  .sidebar-footer-seal img { width: 100%; height: 100%; display: block; border-radius: 8px; }
  body.sidebar-collapsed .sidebar-footer { display: none; }

  #sidebar-toggle-btn {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    width: 36px;
    height: 36px;
    min-height: 36px;
    padding: 0;
    cursor: pointer;
    color: var(--text);
    flex: none;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #sidebar-toggle-btn:hover { background: var(--surface-2); }
  #sidebar-toggle-btn .icon-expand { display: none; }
  body.sidebar-collapsed #sidebar-toggle-btn .icon-collapse { display: none; }
  body.sidebar-collapsed #sidebar-toggle-btn .icon-expand { display: inline; }
  .toolbar-center { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: nowrap; min-width: 0; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; }
  .toolbar-center::-webkit-scrollbar { display: none; }
  .toolbar-spacer { width: 36px; flex: none; }
  .toolbar-group { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; flex: none; }
  .toolbar-gap-lg { width: 28px; flex: none; }
  .btn-icon { width: 14px; height: 14px; flex: none; display: inline-block; vertical-align: middle; }

  .btn {
    font: inherit;
    font-weight: 600;
    border-radius: 8px;
    padding: 10px 16px;
    cursor: pointer;
    border: 1px solid transparent;
    min-height: 44px;

  function removeLine(subAccountId, lineId) {
    var found = findSubAccount(subAccountId);
    if (!found) return;
    var item = null;
    for (var i = 0; i < found.sub.lines.length; i++) {
      if (found.sub.lines[i].id === lineId) { item = found.sub.lines[i]; break; }
    }
    if (!item) return;
    var label = item.kind === 'subtotal' ? 'this subtotal' : 'this line';
    showConfirm('Delete ' + label + '?', function () {
      snapshotState();
      found.sub.lines = found.sub.lines.filter(function (l) { return l.id !== lineId; });
      save();
      render();
    });
  }

  function moveLine(subAccountId, sourceId, targetId, before) {
    var found = findSubAccount(subAccountId);
    if (!found) return;
    var arr = found.sub.lines;
    var fromIdx = indexOf(arr, sourceId);
    var toIdx = indexOf(arr, targetId);
    if (fromIdx === -1 || toIdx === -1 || fromIdx === toIdx) return;
    snapshotState();
    var item = arr.splice(fromIdx, 1)[0];
    toIdx = indexOf(arr, targetId);
    var insertAt = before ? toIdx : toIdx + 1;
    arr.splice(insertAt, 0, item);
    save();
    render();
  }

  function moveAccount(group, sourceId, targetId, before) {
    var b = active();
    if (!b) return;
    var groupIndices = [];
    var groupItems = [];
    b.accounts.forEach(function (a, i) { if (a.group === group) { groupIndices.push(i); groupItems.push(a); } });
    var fromIdx = indexOf(groupItems, sourceId);
    var toIdx = indexOf(groupItems, targetId);
    if (fromIdx === -1 || toIdx === -1 || fromIdx === toIdx) return;
    snapshotState();
    var item = groupItems.splice(fromIdx, 1)[0];
    toIdx = indexOf(groupItems, targetId);
    var insertAt = before ? toIdx : toIdx + 1;
    groupItems.splice(insertAt, 0, item);
    groupIndices.forEach(function (originalIdx, i) { b.accounts[originalIdx] = groupItems[i]; });
    save();
    render();
  }

  function nextAccountNum(group) {
    var b = active();
    if (!b) return 1000;
    var groupMax = 0;
    (b.accounts || []).forEach(function (a) {
      if (a.group !== group) return;
      var n = parseInt(a.num, 10);
      if (!isNaN(n) && n > groupMax) groupMax = n;
    });
    if (groupMax > 0) return (Math.floor(groupMax / 100) + 1) * 100;
    if (group === 'OTHER') return 4000;
    var overallMax = 0;
    (b.accounts || []).forEach(function (a) {
      var n = parseInt(a.num, 10);
      if (!isNaN(n) && n > overallMax) overallMax = n;
    });
    if (overallMax === 0) return 1000;
    return (Math.floor(overallMax / 100) + 1) * 100;
  }

  function nextSubAccountNum(account) {
    var parentNum = parseInt(account.num, 10);
    var base = isNaN(parentNum) ? 0 : Math.floor(parentNum / 100) * 100;
    var max = base;
    (account.subAccounts || []).forEach(function (s) {
      var n = parseInt(s.num, 10);
      if (!isNaN(n) && n > max) max = n;
    });
    if (max === base) return base + 1;
    return max + 1;
  }

    var m = /^(.*)\s+v(\d+)$/.exec(src.title);
    copy.title = m ? (m[1] + ' v' + (parseInt(m[2], 10) + 1)) : (src.title + ' v2');

  function linkGlobal(subAccountId, lineId) {
    var found = findSubAccount(subAccountId);
    if (!found) return;
    var line = null;
    for (var i = 0; i < found.sub.lines.length; i++) {
      if (found.sub.lines[i].id === lineId) { line = found.sub.lines[i]; break; }
    }
    if (!line) return;
    var b = active();
    var names = (b.globals || []).map(function (g) { return g.name; });
    if (!names.length) { window.alert('No globals yet. Add one from the Globals page first.'); return; }
    var current = line.globalId ? ((findGlobalById(line.globalId) || {}).name || '') : '';
    showPrompt({
      title: 'Link to a global',
      help: 'Type the exact name, or leave blank to unlink. Available: ' + names.join(', '),
      value: current,
      inputMode: 'text',
      onSave: function (input) {
        if (input == null) return;
        var t = String(input).trim();
        snapshotState();
        if (!t) {
          line.globalId = null;
        } else {
          var match = (b.globals || []).filter(function (g) { return g.name.toLowerCase() === t.toLowerCase(); })[0];
          if (match) { line.globalId = match.id; var mv = computeGlobalValue(match); line.rate = (typeof mv === 'number') ? mv : (parseFloat(mv) || 0); }
          else { window.alert('No global named "' + t + '" found.'); undoStack.pop(); return; }
        }
        save();
        render();
      }
    });
  }

  function addUnit() {
    var b = active();
    if (!b) return;
    snapshotState();
    if (!b.units) b.units = [];
    b.units.push({ name: 'New Unit', plural: 'New Units' });
    save();
    renderUnitsPanel();

  function downloadBlob(filename, mimeType, content) {
    var blob = new Blob([content], { type: mimeType });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function csvCell(v) {
    var s = (v == null) ? '' : String(v);
    if (/[",\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  function safeFileName(s) {
    return String(s || 'budget').replace(/[^a-z0-9\-_ ]/gi, '').trim().replace(/\s+/g, '-') || 'budget';
  }

  function timestampFileSuffix() {
    var d = new Date();
    function pad(n) { return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + '-' + pad(d.getMinutes()) + '-' + pad(d.getSeconds());
  }

  function buildExportFileName(b) {
    return safeFileName(b.title) + ' ' + timestampFileSuffix();
  }

  function buildExportRows(b, es) {
    var rows = [];
    rows.push(['Section', 'Group', 'Account #', 'Account Name', 'Sub #', 'Sub Name', 'Description', 'Qty', 'Unit', 'X', 'Rate', 'Amount', 'Notes', 'Fringes']);
    var full = es.detailLevel === 'full' && es.sections.subaccountLines;
    GROUPS.forEach(function (g) {
      var accts = b.accounts.filter(function (a) { return a.group === g.value; });
      if (!accts.length) return;
      accts.forEach(function (a) {
        rows.push(['Account', g.label, a.num, a.name, '', '', '', '', '', '', '', fmtNum(accountSubtotal(a)), '', '']);
        if (!es.sections.accountDetail) return;
        a.subAccounts.forEach(function (s) {
          rows.push(['Sub-account', g.label, a.num, a.name, s.num, s.name, '', '', '', '', '', fmtNum(subAccountTotal(s)), '', '']);
          if (!full) return;
          s.lines.forEach(function (l) {
            if (l.kind === 'subtotal') {
              rows.push(['Subtotal', g.label, a.num, a.name, s.num, s.name, 'Subtotal', '', '', '', '', '', '', '']);
              return;
            }
            var fringeNames = es.sections.fringes ? (l.fringeIds || []).map(function (fid) { var f = findFringe(fid); return f ? f.name : null; }).filter(Boolean).join('; ') : '';
            rows.push(['Line', g.label, a.num, a.name, s.num, s.name, l.description || '', l.qty || '', unitDisplayValue(l) || '', l.x || '', l.rate || '', fmtNum(lineAmount(l)), es.sections.notes ? (l.notes || '') : '', fringeNames]);
          });
        });
      });
      rows.push(['Group Total', g.label, '', '', '', '', '', '', '', '', '', fmtNum(groupTotal(g.value)), '', '']);
    });
    if (es.sections.fringes) rows.push(['Total Fringes', '', '', '', '', '', '', '', '', '', '', fmtNum(totalFringes()), '', '']);
    if (es.sections.contingency) rows.push(['Contingency (' + (b.contingencyPercent || 0) + '%)', '', '', '', '', '', '', '', '', '', '', fmtNum(contingencyAmount()), '', '']);
    rows.push(['Grand Total', '', '', '', '', '', '', '', '', '', '', fmtNum(grandTotal()), '', '']);
    if (es.sections.lockVariance && b.locked) {
      rows.push(['Original Total', '', '', '', '', '', '', '', '', '', '', fmtNum(b.originalTotal || 0), '', '']);
      rows.push(['Variance', '', '', '', '', '', '', '', '', '', '', fmtNum(grandTotal() - (b.originalTotal || 0)), '', '']);
    }
    if (es.sections.fringes && (b.fringes || []).length) {
      rows.push(['', '', '', '', '', '', '', '', '', '', '', '', '', '']);
      rows.push(['Fringe', 'Name', 'Type', 'Rate', '', '', '', '', '', '', '', '', '', '']);
      b.fringes.forEach(function (f) { rows.push(['Fringe', f.name, (f.type === 'percent' ? '% of wages' : 'Flat per line'), (f.type === 'percent' ? f.rate + '%' : fmtNum(f.rate)), '', '', '', '', '', '', '', '', '', '']); });
    }
    if (es.sections.globals && (b.globals || []).length) {
      rows.push(['', '', '', '', '', '', '', '', '', '', '', '', '', '']);
      rows.push(['Global', 'Name', 'Value', '', '', '', '', '', '', '', '', '', '', '']);
      b.globals.forEach(function (g) { rows.push(['Global', g.name, (g.value == null ? '' : g.value), '', '', '', '', '', '', '', '', '', '', '']); });
    }
    if (es.sections.units && (b.units || []).length) {
      rows.push(['', '', '', '', '', '', '', '', '', '', '', '', '', '']);
      rows.push(['Unit', 'Name', 'Plural', '', '', '', '', '', '', '', '', '', '', '']);
      b.units.forEach(function (u) { rows.push(['Unit', u.name, u.plural, '', '', '', '', '', '', '', '', '', '', '']); });
    }
    return rows;
  }

  function fmtNum(n) {
    return (Number(n) || 0).toFixed(2);
  }

  function exportCSV() {
    var b = active();
    if (!b) return;
    var es = ensureExportSettings(b);
    var rows = buildExportRows(b, es);
    var csv = rows.map(function (r) { return r.map(csvCell).join(','); }).join('\r\n');
    downloadBlob(buildExportFileName(b) + '.csv', 'text/csv;charset=utf-8;', csv);
  }

  function exportExcel() {
    var b = active();
    if (!b) return;
    var es = ensureExportSettings(b);
    var rows = buildExportRows(b, es);
    var html = '<html><head><meta charset="UTF-8"></head><body><table border="1">' +
      rows.map(function (r, i) {
        var tag = i === 0 ? 'th' : 'td';
        return '<tr>' + r.map(function (c) { return '<' + tag + '>' + esc(c) + '</' + tag + '>'; }).join('') + '</tr>';
      }).join('') + '</table></body></html>';
    downloadBlob(buildExportFileName(b) + '.xls', 'application/vnd.ms-excel', html);
  }

  function exportNLB() {
    var b = active();
    if (!b) return;
    downloadBlob(buildExportFileName(b) + '.nlb', 'application/json', JSON.stringify(b, null, 2));
  }

  function buildPdfSections(b, es) {
    var full = es.detailLevel === 'full' && es.sections.subaccountLines;
    var sections = [];
    if (es.titlePage) {
      sections.push({
        raw: '<div class="pdf-titlepage">' +
          '<div class="pdf-title-company">' + esc(es.companyName || '') + '</div>' +
          '<div class="pdf-title-name">“' + esc(b.title) + '”</div>' +
          '<div class="pdf-title-sub">Production Budget</div>' +
          '<div class="pdf-title-meta-row">' +
          '<div class="pdf-meta-col left">' +
          (es.includeDate ? '<div>Budget Date: ' + esc(new Date().toLocaleDateString()) + '</div>' : '') +
          '</div>' +
          '<div class="pdf-meta-col right">' +
          (es.preparedBy ? '<div>Prepared by: ' + esc(es.preparedBy) + '</div>' : '') +
          '</div>' +
          '</div>' +
          '</div>',
        forceBreak: true,
        forceBreakAfter: true
      });
    }
    if (es.sections.topsheet) {
      var tsRows = [];
      GROUPS.forEach(function (g) {
        var accts = b.accounts.filter(function (a) { return a.group === g.value; });
        if (!accts.length) return;
        tsRows.push('<tr class="pdf-group-row"><td colspan="3">' + esc(g.label) + '</td></tr>');
        accts.forEach(function (a) {
          tsRows.push('<tr><td>' + esc(a.num) + '</td><td>' + esc(a.name) + '</td><td class="pdf-r">' + fmt(accountSubtotal(a)) + '</td></tr>');
        });
        tsRows.push('<tr class="pdf-subtotal-row"><td colspan="2">' + esc(g.label) + ' Total</td><td class="pdf-r">' + fmt(groupTotal(g.value)) + '</td></tr>');
      });
      if (es.sections.fringes) tsRows.push('<tr class="pdf-subtotal-row"><td colspan="2">Total Fringes</td><td class="pdf-r">' + fmt(totalFringes()) + '</td></tr>');
      if (es.sections.contingency) tsRows.push('<tr class="pdf-subtotal-row"><td colspan="2">Contingency (' + (b.contingencyPercent || 0) + '%)</td><td class="pdf-r">' + fmt(contingencyAmount()) + '</td></tr>');
      tsRows.push('<tr class="pdf-grand-row"><td colspan="2">Grand Total</td><td class="pdf-r">' + fmt(grandTotal()) + '</td></tr>');
      if (es.sections.lockVariance && b.locked) {
        tsRows.push('<tr class="pdf-subtotal-row"><td colspan="2">Original Total</td><td class="pdf-r">' + fmt(b.originalTotal || 0) + '</td></tr>');
        tsRows.push('<tr class="pdf-subtotal-row"><td colspan="2">Variance</td><td class="pdf-r">' + fmt(grandTotal() - (b.originalTotal || 0)) + '</td></tr>');
      }
      sections.push({
        forceBreak: true,
        forceBreakAfter: true,
        title: '<h2 class="pdf-h2">Top Sheet</h2>',
        table: { headHtml: '<tr><th>#</th><th>Account</th><th class="pdf-r">Total</th></tr>', rows: tsRows }
      });
    }
    if (es.sections.accountDetail) {
      // Detail table columns are #, Description, Qty, Unit, X, Rate, Total
      // (no separate Account column — it duplicated the # column). Full-width
      // divider rows (account/sub-account headers, Subtotal) span every
      // column; label+total rows (sub-account Total, account TOTAL) span all
      // columns except the last, which holds the total value.
      var detailColCount = full ? 7 : 6;
      var detailGroups = [];
      GROUPS.forEach(function (g) {
        var accts = b.accounts.filter(function (a) { return a.group === g.value; });
        if (!accts.length) return;
        accts.forEach(function (a) {
          var rows = [];
          rows.push('<tr class="pdf-account-row"><td colspan="' + detailColCount + '">' + esc(a.num) + ' — ' + esc(a.name) + '</td></tr>');
          a.subAccounts.forEach(function (s) {
            if (!full) {
              rows.push('<tr><td>' + esc(s.num) + '</td><td>' + esc(s.name) + '</td><td></td><td></td><td></td><td class="pdf-r">' + fmt(subAccountTotal(s)) + '</td></tr>');
              return;
            }
            rows.push('<tr class="pdf-group-row"><td colspan="' + detailColCount + '">' + esc(s.num) + ' — ' + esc(s.name) + '</td></tr>');
            s.lines.forEach(function (l) {
              if (l.kind === 'subtotal') { rows.push('<tr class="pdf-subtotal-row"><td colspan="' + detailColCount + '">Subtotal</td></tr>'); return; }
              var noteTxt = es.sections.notes && l.notes ? ' <span class="pdf-note">(' + esc(l.notes) + ')</span>' : '';
              var fringeTxt = es.sections.fringes && l.fringeIds && l.fringeIds.length ? ' <span class="pdf-note">[' + esc((l.fringeIds || []).map(function (fid) { var f = findFringe(fid); return f ? f.name : null; }).filter(Boolean).join(', ')) + ']</span>' : '';
              rows.push('<tr><td></td><td>' + esc(l.description || '') + noteTxt + fringeTxt + '</td><td>' + esc(l.qty || '') + '</td><td>' + esc(unitDisplayValue(l) || '') + '</td><td>' + esc(l.x || '') + '</td><td class="pdf-r">' + fmt(l.rate || 0) + '</td><td class="pdf-r">' + fmt(lineAmount(l)) + '</td></tr>');
            });
            rows.push('<tr class="pdf-subtotal-row"><td colspan="' + (detailColCount - 1) + '">' + esc(s.name) + ' Total</td><td class="pdf-r">' + fmt(subAccountTotal(s)) + '</td></tr>');
          });
          if (es.sections.fringes) {
            rows.push('<tr class="pdf-subtotal-row"><td colspan="' + (detailColCount - 1) + '">' + esc(a.num) + ' — ' + esc(a.name) + ' FRINGES</td><td class="pdf-r">' + fmt(fringeAmountForAccount(a)) + '</td></tr>');
          }
          rows.push('<tr class="pdf-grand-row pdf-account-total-row"><td colspan="' + (detailColCount - 1) + '">' + esc(a.num) + ' — ' + esc(a.name) + ' TOTAL</td><td class="pdf-r">' + fmt(accountSubtotal(a)) + '</td></tr>');
          detailGroups.push(rows);
        });
      });
      sections.push({
        forceBreak: true,
        forceBreakAfter: true,
        title: '<h2 class="pdf-h2">Details</h2>',
        groupedTable: {
          headHtml: '<tr><th>#</th>' + (full ? '<th>Description</th><th>Qty</th><th>Unit</th><th>X</th><th class="pdf-r">Rate</th>' : '<th></th><th></th><th></th><th></th>') + '<th class="pdf-r">Total</th></tr>',
          groups: detailGroups

    }
    if (es.sections.globals && (b.globals || []).length) {
      sections.push({
        forceBreak: true,
        title: '<h2 class="pdf-h2">Globals</h2>',
        table: {
          headHtml: '<tr><th>Name</th><th>Value</th></tr>',
          rows: b.globals.map(function (g) { return '<tr><td>' + esc(g.name) + '</td><td>' + esc(g.value == null ? '' : g.value) + '</td></tr>'; })
        }
      });
    }
    if (es.sections.fringes && (b.fringes || []).length) {
      var fringeRowsX = b.fringes.map(function (f) { return '<tr><td>' + esc(f.name) + '</td><td>' + (f.type === 'percent' ? '% of wages' : 'Flat per line') + '</td><td class="pdf-r">' + (f.type === 'percent' ? esc(f.rate) + '%' : fmt(f.rate)) + '</td><td class="pdf-r">' + fmt(fringeDollarTotal(f)) + '</td></tr>'; });
      fringeRowsX.push('<tr class="pdf-grand-row"><td colspan="3">FRINGES GRAND TOTAL</td><td class="pdf-r">' + fmt(totalFringes()) + '</td></tr>');
      sections.push({
        forceBreak: true,
        title: '<h2 class="pdf-h2">Fringes</h2>',
        table: {
          headHtml: '<tr><th>Name</th><th>Type</th><th class="pdf-r">Rate</th><th class="pdf-r">$ Total</th></tr>',
          rows: fringeRowsX
        }
      });

    if (es.sections.units && (b.units || []).length) {
      sections.push({
        forceBreak: true,
        title: '<h2 class="pdf-h2">Units</h2>',

          rows: b.units.map(function (u) { return '<tr><td>' + esc(u.name) + '</td><td>' + esc(u.plural) + '</td></tr>'; })
        }
      });
    }
    if (es.sections.groups && (b.groups || []).length) {
      var groupsGrandTotal = 0;
      var groupRowsX = b.groups.map(function (gr) {
        var gTotal = groupDollarTotal(gr);
        groupsGrandTotal += gTotal;
        return '<tr><td>' + esc(gr.name) + '</td><td class="pdf-r">' + groupUsageCount(gr) + '</td><td class="pdf-r">' + fmt(gTotal) + '</td></tr>';
      });
      groupRowsX.push('<tr class="pdf-grand-row"><td colspan="2">GROUPS GRAND TOTAL</td><td class="pdf-r">' + fmt(groupsGrandTotal) + '</td></tr>');
      sections.push({

  function paginatePdfSections(sections, cssClassName, landscape) {
    var staging = document.createElement('div');
    staging.className = cssClassName;
    staging.style.position = 'absolute';
    staging.style.left = '-99999px';
    staging.style.top = '0';
    staging.style.visibility = 'hidden';
    // .pdf-export-root is display:none unless body.pdf-export-mode is set, which
    // only happens after pagination runs. Force it visible for layout via an
    // inline style (wins over the class rule) so getBoundingClientRect() during
    // measurement returns real heights instead of 0.
    staging.style.display = 'block';
    document.body.appendChild(staging);

    // Shrunk well below the theoretical @page-margin printable area (960/720
    // for 0.5in margins) because real browser print pipelines (window.print
    // -> Save as PDF) often reserve additional space beyond the declared
    // @page margin - e.g. their own default margin behavior or a "Headers
    // and footers" option - regardless of our CSS. This leaves a real
    // ~96px (~1in) buffer per page so the footer never spills onto a
    // following sheet.
    var pageWpx = landscape ? 864 : 720;
    var pageHpx = landscape ? 624 : 864;
    var marginPx = 24;
    var safety = 72;
    var contentWidth = pageWpx - marginPx * 2;
    var availableHeight = pageHpx - marginPx * 2 - safety;
    staging.style.width = contentWidth + 'px';
    // Match the background/color/padding overrides that the real export
    // applies via 'body.pdf-export-mode .pdf-export-root' — applied directly
    // as inline styles. Never toggle the body class itself here: the rule
    // 'body.pdf-export-mode > *:not(#pdf-export-overlay)' would hide this
    // staging div (a direct child of body) and silently zero out every
    // row-height measurement below.
    staging.style.background = '#fff';
    staging.style.color = '#111';
    staging.style.padding = '0';

    var pages = [];
    var currentBlocks = [];
    var currentHeight = 0;

    function measure(html) {
      staging.innerHTML = html;
      var el = staging.firstElementChild;
      // Round up: fractional getBoundingClientRect() heights can under-count
      // by a hair versus how the real print engine lays the box out, and
      // those hairline gaps compound over many rows into real overflow.
      return Math.ceil(el ? el.getBoundingClientRect().height : staging.getBoundingClientRect().height);
    }

    function pushPage() {
      if (currentBlocks.length) pages.push(currentBlocks.join(''));
      currentBlocks = [];
      currentHeight = 0;
    }

    sections.forEach(function (sec) {
      if (sec.forceBreak && currentBlocks.length) pushPage();
      if (sec.raw) {
        var rh = measure(sec.raw);
        if (currentBlocks.length && currentHeight + rh > availableHeight) pushPage();
        currentBlocks.push(sec.raw);
        currentHeight += rh;
        if (sec.forceBreakAfter) pushPage();
        return;
      }
      if (sec.title) {
        var th = measure(sec.title);
        if (currentBlocks.length && currentHeight + th > availableHeight) pushPage();
        currentBlocks.push(sec.title);
        currentHeight += th;
      }
      if (sec.table) {
        var headH = measure('<table class="pdf-table"><thead>' + sec.table.headHtml + '</thead></table>');
        var tableBuf = '';
        function openNewTable() {
          tableBuf = '<table class="pdf-table"><thead>' + sec.table.headHtml + '</thead><tbody>';
          currentHeight += headH;
        }
        openNewTable();
        sec.table.rows.forEach(function (rowHtml) {
          var rh2 = measure('<table class="pdf-table"><tbody>' + rowHtml + '</tbody></table>');
          if (currentHeight + rh2 > availableHeight && currentBlocks.length) {
            tableBuf += '</tbody></table>';
            currentBlocks.push(tableBuf);
            pushPage();
            openNewTable();
          }
          tableBuf += rowHtml;
          currentHeight += rh2;
        });
        tableBuf += '</tbody></table>';
        currentBlocks.push(tableBuf);
      }
      if (sec.groupedTable) {
        var gt = sec.groupedTable;
        var gColCount = (gt.headHtml.match(/<th/g) || []).length || 7;
        var gColgroup = '<colgroup>' + Array.from({ length: gColCount }).map(function (_, ci) {
          var w = ci === 0 ? 7 : (ci === 1 ? 30 : (ci === gColCount - 1 ? 20 : Math.floor(43 / Math.max(1, gColCount - 3))));
          return '<col style="width:' + w + '%">';
        }).join('') + '</colgroup>';
        // Flatten all rows and measure them in ONE continuous live layout pass so
        // heights reflect real rendering (measuring many tiny isolated tables
        // independently was found to badly under-measure real row heights).
        var flatRows = [];
        gt.groups.forEach(function (groupRows) {
          groupRows.forEach(function (rowHtml) { flatRows.push(rowHtml); });
        });
        staging.innerHTML = '<table class="pdf-table">' + gColgroup + '<thead>' + gt.headHtml + '</thead><tbody>' + flatRows.join('') + '</tbody></table>';
        var gHeadH = Math.ceil(staging.querySelector('thead').getBoundingClientRect().height);
        var trEls = staging.querySelectorAll('tbody tr');
        var rowHeights = [];
        for (var ri = 0; ri < trEls.length; ri++) rowHeights.push(Math.ceil(trEls[ri].getBoundingClientRect().height));
        staging.innerHTML = '';
        var groupRanges = [];
        var goff = 0;
        gt.groups.forEach(function (groupRows) {
          groupRanges.push({ start: goff, end: goff + groupRows.length });
          goff += groupRows.length;
        });
        var gTableBuf = '';
        var gRowsOnPage = 0;
        function openNewGroupedTable() {
          gTableBuf = '<table class="pdf-table">' + gColgroup + '<thead>' + gt.headHtml + '</thead><tbody>';
          currentHeight += gHeadH;
          gRowsOnPage = 0;
        }
        function flushGroupedTable() {
          gTableBuf += '</tbody></table>';
          currentBlocks.push(gTableBuf);
        }
        openNewGroupedTable();
        gt.groups.forEach(function (groupRows, gi) {
          var range = groupRanges[gi];
          var groupH = 0;
          for (var i = range.start; i < range.end; i++) groupH += rowHeights[i];
          var hasContentOnPage = currentBlocks.length > 0 || gRowsOnPage > 0;
          if (groupH <= availableHeight) {
            if (hasContentOnPage && currentHeight + groupH > availableHeight) {
              flushGroupedTable();
              pushPage();
              openNewGroupedTable();
            }
            for (var i2 = range.start; i2 < range.end; i2++) {
              gTableBuf += flatRows[i2];
              currentHeight += rowHeights[i2];
            }
            gRowsOnPage += groupRows.length;
          } else {
            for (var i3 = range.start; i3 < range.end; i3++) {
              var rh3 = rowHeights[i3];
              var hasRowsOnPage = currentBlocks.length > 0 || gRowsOnPage > 0;
              if (hasRowsOnPage && currentHeight + rh3 > availableHeight) {
                flushGroupedTable();
                pushPage();
                openNewGroupedTable();
              }
              gTableBuf += flatRows[i3];
              currentHeight += rh3;
              gRowsOnPage += 1;
            }
          }
        });
        flushGroupedTable();
      }
      if (sec.forceBreakAfter) pushPage();
    });
    pushPage();
    document.body.removeChild(staging);
    return pages;
  }

  function renderPdfPagesHtml(pages, es, b) {
    var total = pages.length;
    var companyLabel = 'Property of ' + (es.companyName || b.title);
    var dateLabel = esc(new Date().toLocaleString());
    return pages.map(function (pageHtml, i) {
      var footer = '<div class="pdf-page-footer">' +
        '<span class="pdf-footer-company">' + esc(companyLabel) + '</span>' +
        '<span class="pdf-footer-stamp">' + dateLabel + '</span>' +
        '<span class="pdf-footer-pagenum">Page ' + (i + 1) + ' of ' + total + '</span>' +
        '</div>';
      return '<div class="pdf-page">' + pageHtml + footer + '</div>';
    }).join('');
  }

  function exportPDF() {
    var b = active();
    if (!b) return;
    var es = ensureExportSettings(b);
    var overlay = document.getElementById('pdf-export-overlay');
    if (overlay) overlay.parentNode.removeChild(overlay);
    overlay = document.createElement('div');
    overlay.id = 'pdf-export-overlay';
    var landscape = es.orientation === 'landscape';
    var cls = 'pdf-export-root pdf-font-' + es.fontSize + (es.color === 'bw' ? ' pdf-bw' : '');
    overlay.className = cls;
    var sections = buildPdfSections(b, es);
    var pages = paginatePdfSections(sections, cls, landscape);
    overlay.innerHTML = renderPdfPagesHtml(pages, es, b);
    document.body.appendChild(overlay);
    document.body.classList.add('pdf-export-mode');
    document.body.classList.toggle('pdf-landscape', landscape);
    var prevTitle = document.title;
    document.title = buildExportFileName(b);
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        window.print();
        document.title = prevTitle;
        setTimeout(function () {
          document.body.classList.remove('pdf-export-mode');
          document.body.classList.remove('pdf-landscape');
          var ov = document.getElementById('pdf-export-overlay');
          if (ov) ov.parentNode.removeChild(ov);
        }, 500);
      });
    });
  }

  function importNLBFile() {

  function parseCsvText(text) {
    var rows = [];
    var row = [];
    var cur = '';
    var inQuotes = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { cur += '"'; i++; } else { inQuotes = false; }
        } else { cur += c; }
      } else if (c === '"') {
        inQuotes = true;
      } else if (c === ',') {
        row.push(cur); cur = '';
      } else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(cur); cur = '';
        rows.push(row); row = [];
      } else { cur += c; }
    }
    if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
    return rows.filter(function (r) { return r.length && r.some(function (c) { return c !== ''; }); });
  }

  function importCSVFile() {
    var input = document.getElementById('import-csv-input');
    if (!input || !input.files || !input.files[0]) { window.alert('Choose a .csv file first.'); return; }
    var file = input.files[0];
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var rows = parseCsvText(String(reader.result));
        if (!rows.length) { window.alert('That CSV file looks empty.'); return; }
        var header = rows[0].map(function (h) { return h.trim().toLowerCase(); });
        var idx = {
          group: header.indexOf('group'), accNum: header.indexOf('account #'), accName: header.indexOf('account name'),
          subNum: header.indexOf('sub #'), subName: header.indexOf('sub name'), desc: header.indexOf('description'),
          qty: header.indexOf('qty'), unit: header.indexOf('unit'), x: header.indexOf('x'), rate: header.indexOf('rate')
        };
        if (idx.accName < 0 || idx.subName < 0) { window.alert('CSV must include at least Account Name and Sub Name columns (matching an exported CSV).'); return; }
        var newBudget = { id: uid(), title: 'Imported CSV Budget', accounts: [], contingencyPercent: 0, currency: 'USD', globals: [], fringes: [], units: DEFAULT_UNITS.map(function (u) { return { name: u.name, plural: u.plural }; }) };
        var accMap = {};
        var subMap = {};
        for (var r = 1; r < rows.length; r++) {
          var row = rows[r];
          var groupRaw = (idx.group >= 0 ? row[idx.group] : '') || 'ATL';
          var group = /other/i.test(groupRaw) ? 'OTHER' : /btl\s*post/i.test(groupRaw) ? 'BTLPost' : /btl/i.test(groupRaw) ? 'BT' : 'ATL';
          var accName = row[idx.accName];
          var subName = row[idx.subName];
          if (!accName) continue;
          var accKey = group + '|' + accName;
          if (!accMap[accKey]) {
            var acc = { id: uid(), group: group, num: (idx.accNum >= 0 ? row[idx.accNum] : '') || '', name: accName, subAccounts: [] };
            accMap[accKey] = acc;
            newBudget.accounts.push(acc);
          }
          if (!subName) continue;
          var subKey = accKey + '|' + subName;
          if (!subMap[subKey]) {
            var sub = { id: uid(), num: (idx.subNum >= 0 ? row[idx.subNum] : '') || '', name: subName, lines: [] };
            subMap[subKey] = sub;
            accMap[accKey].subAccounts.push(sub);
          }
          var desc = idx.desc >= 0 ? row[idx.desc] : '';
          if (!desc) continue;
          subMap[subKey].lines.push({
            id: uid(), kind: 'line', description: desc,
            qty: idx.qty >= 0 ? row[idx.qty] : '', unit: idx.unit >= 0 ? row[idx.unit] : '',
            x: idx.x >= 0 ? row[idx.x] : 1, rate: idx.rate >= 0 ? row[idx.rate] : 0
          });
        }
        if (!newBudget.accounts.length) { window.alert('No accounts could be parsed from that CSV.'); return; }
        snapshotState();
        state.budgets.push(newBudget);
        state.activeBudgetId = newBudget.id;
        view = { mode: 'sheet' };
        save();
        render();
        closeImportPanel();
      } catch (e) {
        window.alert('Could not parse that CSV file.');
      }
    };
    reader.readAsText(file);
  }

  var pendingMMBImport = null;

  function defaultGroupForMMBCategoryNumber(num) {
    var n = parseInt(num, 10);
    if (isNaN(n)) return 'BT';
    if (n < 2000) return 'ATL';
    if (n < 3200) return 'BT';
    if (n < 4000) return 'BTLPost';
    return 'OTHER';
  }

  function mmbTextOf(el, tag) {
    var els = el.getElementsByTagName(tag);
    return els.length ? (els[0].textContent || '').trim() : '';
  }

  function mmbChildCodes(el, wrapperTag, itemTag) {
    var wrap = el.getElementsByTagName(wrapperTag);
    if (!wrap.length) return [];
    var items = wrap[0].getElementsByTagName(itemTag);
    var out = [];
    for (var i = 0; i < items.length; i++) {
      var v = (items[i].textContent || '').trim();
      if (v) out.push(v);
    }
    return out;
  }

  function parseMMBXML(text) {
    var cleaned = text.replace(/ xmlns="[^"]*"/, '');
    var doc = new DOMParser().parseFromString(cleaned, 'text/xml');
    var perr = doc.getElementsByTagName('parsererror');
    if (perr.length) throw new Error('Invalid XML file.');
    var categoryEls = doc.getElementsByTagName('category');
    var categories = [];
    for (var i = 0; i < categoryEls.length; i++) {
      var c = categoryEls[i];
      categories.push({ cID: mmbTextOf(c, 'cID'), num: mmbTextOf(c, 'cNumber'), name: mmbTextOf(c, 'cDescription') });
    }
    var accountEls = doc.getElementsByTagName('account');
    var accounts = [];
    for (var j = 0; j < accountEls.length; j++) {
      var a = accountEls[j];
      accounts.push({ categoryID: mmbTextOf(a, 'categoryID'), aID: mmbTextOf(a, 'aID'), num: mmbTextOf(a, 'aNumber'), name: mmbTextOf(a, 'aDescription') });
    }
    var detailEls = doc.getElementsByTagName('detail');
    var details = [];
    for (var k = 0; k < detailEls.length; k++) {
      var d = detailEls[k];
      details.push({
        accountID: mmbTextOf(d, 'accountID'),
        description: mmbTextOf(d, 'dDescription'),
        qty: mmbTextOf(d, 'dAmount'),
        unit: mmbTextOf(d, 'dUnit'),
        x: mmbTextOf(d, 'dX'),
        rate: mmbTextOf(d, 'dRate'),
        fringeCodes: mmbChildCodes(d, 'dFringes', 'dFringe'),
        groupCodes: mmbChildCodes(d, 'dGroups', 'dGroup'),
        globalCodes: mmbChildCodes(d, 'dGlobalsUsed', 'dGlobalUsed')
      });
    }
    if (!categories.length && !accounts.length) throw new Error('No Movie Magic categories/accounts found in this file.');
    return { categories: categories, accounts: accounts, details: details };
  }

  function openMMBImportReview(parsed, fileLabel) {
    var contingencyCatId = null;
    var contingencyPercent = 0;
    parsed.categories.forEach(function (c) {
      if (/contingency/i.test(c.name)) {
        contingencyCatId = c.cID;
        var m = /([\d.]+)\s*%/.exec(c.name);
        if (m) contingencyPercent = parseFloat(m[1]) || 0;
      }
    });
    var fringeCodes = {}, groupCodes = {}, globalCodes = {}, unitCodes = {};
    parsed.details.forEach(function (d) {
      d.fringeCodes.forEach(function (code) { fringeCodes[code] = true; });
      d.groupCodes.forEach(function (code) { groupCodes[code] = true; });
      d.globalCodes.forEach(function (code) { globalCodes[code] = true; });
      if (d.unit) unitCodes[d.unit] = true;
    });
    pendingMMBImport = {
      fileLabel: fileLabel,
      parsed: parsed,
      contingencyCatId: contingencyCatId,
      contingencyPercent: contingencyPercent,
      categoryGroups: {},
      fringeNames: {},
      fringeRates: {},
      groupNames: {},
      groupColors: {},
      globalNames: {},
      globalValues: {},
      unitPlurals: {},
      unitHours: {}
    };
    parsed.categories.forEach(function (c) {
      if (c.cID === contingencyCatId) return;
      pendingMMBImport.categoryGroups[c.cID] = defaultGroupForMMBCategoryNumber(c.num);
    });
    Object.keys(fringeCodes).forEach(function (code) { pendingMMBImport.fringeNames[code] = code; pendingMMBImport.fringeRates[code] = 0; });
    Object.keys(groupCodes).forEach(function (code, i) { pendingMMBImport.groupNames[code] = code; pendingMMBImport.groupColors[code] = GROUP_COLORS[i % GROUP_COLORS.length]; });
    Object.keys(globalCodes).forEach(function (code) { pendingMMBImport.globalNames[code] = code; pendingMMBImport.globalValues[code] = ''; });
    Object.keys(unitCodes).forEach(function (code) { pendingMMBImport.unitPlurals[code] = code; pendingMMBImport.unitHours[code] = ''; });
    renderMMBReviewModal();
    var modal = document.getElementById('mmb-review-modal');
    var backdrop = document.getElementById('mmb-review-backdrop');
    if (modal) modal.classList.add('open');
    if (backdrop) backdrop.classList.add('open');
  }

  function closeMMBReviewModal() {
    var modal = document.getElementById('mmb-review-modal');
    var backdrop = document.getElementById('mmb-review-backdrop');
    if (modal) modal.classList.remove('open');
    if (backdrop) backdrop.classList.remove('open');
    pendingMMBImport = null;
  }

    function unitRows(plurals, hours) {

          '<input type="text" class="mmb-unit-hours" data-code="' + esc(code) + '" value="' + esc(hours[code] || '') + '" placeholder="Hours (optional)" style="max-width:100px;flex:none;">' +
          '</div>';

    body.innerHTML =

      '<h4 class="mmb-review-h4">Global codes found &mdash; set a starting value</h4>' + globalRows(p.globalNames, p.globalValues) +
      '<h4 class="mmb-review-h4">Units found &mdash; set plural form and hour equivalence</h4>' + unitRows(p.unitPlurals, p.unitHours);

  function confirmMMBImport() {
    var p = pendingMMBImport;
    if (!p) return;
    var parsed = p.parsed;
    var fringeIdByCode = {}, groupIdByCode = {}, globalIdByCode = {};
    var fringes = Object.keys(p.fringeNames).map(function (code) {
      var id = uid(); fringeIdByCode[code] = id;
      var rate = parseFloat(p.fringeRates[code]);
      return { id: id, name: p.fringeNames[code] || code, type: 'percent', rate: isNaN(rate) ? 0 : rate };
    });
    var groups = Object.keys(p.groupNames).map(function (code, i) {
      var id = uid(); groupIdByCode[code] = id;
      return { id: id, name: p.groupNames[code] || code, color: p.groupColors[code] || GROUP_COLORS[i % GROUP_COLORS.length] };
    });
    var globals = Object.keys(p.globalNames).map(function (code) {
      var id = uid(); globalIdByCode[code] = id;
      return { id: id, name: p.globalNames[code] || code, value: p.globalValues[code] || '' };
    });
    var importedUnitNames = {};
    var units = DEFAULT_UNITS.map(function (u) { return { name: u.name, plural: u.plural }; });
    units.forEach(function (u) { importedUnitNames[u.name.toLowerCase()] = true; });
    Object.keys(p.unitPlurals).forEach(function (code) {
      if (importedUnitNames[code.toLowerCase()]) return;
      var hoursVal = parseFloat(p.unitHours[code]);
      units.push({ name: code, plural: p.unitPlurals[code] || code, hours: isNaN(hoursVal) ? null : hoursVal });
      importedUnitNames[code.toLowerCase()] = true;
    });
    var accountByCatId = {};
    var accounts = [];
    parsed.categories.forEach(function (c) {
      if (c.cID === p.contingencyCatId) return;
      var acc = { id: uid(), num: c.num, name: c.name, group: p.categoryGroups[c.cID] || 'BT', subAccounts: [], fringeIds: [] };
      accountByCatId[c.cID] = acc;
      accounts.push(acc);
    });
    var subByAccId = {};
    parsed.accounts.forEach(function (a) {
      var parentAcc = accountByCatId[a.categoryID];
      if (!parentAcc) return;
      var sub = { id: uid(), num: a.num, name: a.name, lines: [], groupIds: [] };
      subByAccId[a.aID] = sub;
      parentAcc.subAccounts.push(sub);
    });
    parsed.details.forEach(function (d) {
      var sub = subByAccId[d.accountID];
      if (!sub) return;
      var fIds = d.fringeCodes.map(function (code) { return fringeIdByCode[code]; }).filter(Boolean);
      var gIds = d.groupCodes.map(function (code) { return groupIdByCode[code]; }).filter(Boolean);
      sub.lines.push({
        id: uid(), kind: 'line', num: '', description: d.description || '',
        qty: d.qty || '', unit: d.unit || '', x: d.x || 1, rate: d.rate || 0,
        actual: '', fringeIds: fIds, groupIds: gIds, raw: {}
      });
    });
    var newBudget = {
      id: uid(),
      title: (p.fileLabel || 'Imported MMB Budget').replace(/\.xml$/i, ''),
      accounts: accounts,
      contingencyPercent: p.contingencyPercent || 0,
      currency: 'USD',
      globals: globals,
      fringes: fringes,
      units: units,
      groups: groups,
      locked: false,
      originalTotal: null,
      showActuals: false
    };
    snapshotState();
    state.budgets.push(newBudget);
    state.activeBudgetId = newBudget.id;
    view = { mode: 'sheet' };
    save();
    render();
    closeMMBReviewModal();
    closeImportPanel();
  }

  function importMMBXMLFile() {
    var input = document.getElementById('import-mmb-input');
    if (!input || !input.files || !input.files[0]) { window.alert('Choose a Movie Magic Budgeting .xml export first.'); return; }
    var file = input.files[0];
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var parsed = parseMMBXML(String(reader.result));
        openMMBImportReview(parsed, file.name);
      } catch (e) {
        window.alert('Could not read that Movie Magic XML file: ' + (e && e.message ? e.message : 'unknown error'));
      }
    };
    reader.readAsText(file);
  }

    var q = term.trim().toLowerCase();

    results.innerHTML = matches.slice(0, 40).map(function (m) {

  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'find-input') { renderFindResults(t.value); return; }
    if (t.id === 'help-search-input') {
      var q = t.value;
      var sels = document.getElementById('help-sections');
      if (sels) sels.innerHTML = helpSectionsHTML(q);
      return;
    }
    if (t.classList && t.classList.contains('mmb-fringe-name')) {
      if (pendingMMBImport) { pendingMMBImport.fringeNames[t.dataset.code] = t.value; }
      return;
    }
    if (t.classList && t.classList.contains('mmb-group-name')) {
      if (pendingMMBImport) { pendingMMBImport.groupNames[t.dataset.code] = t.value; }
      return;
    }
    if (t.classList && t.classList.contains('mmb-global-name')) {
      if (pendingMMBImport) { pendingMMBImport.globalNames[t.dataset.code] = t.value; }
      return;
    }
    if (t.classList && t.classList.contains('mmb-fringe-rate')) {
      if (pendingMMBImport) { pendingMMBImport.fringeRates[t.dataset.code] = t.value; }
      return;
    }
    if (t.classList && t.classList.contains('mmb-global-value')) {
      if (pendingMMBImport) { pendingMMBImport.globalValues[t.dataset.code] = t.value; }
      return;
    }
    if (t.classList && t.classList.contains('mmb-unit-plural')) {
      if (pendingMMBImport) { pendingMMBImport.unitPlurals[t.dataset.code] = t.value; }
      return;
    }
    if (t.classList && t.classList.contains('mmb-unit-hours')) {
      if (pendingMMBImport) { pendingMMBImport.unitHours[t.dataset.code] = t.value; }
      return;
    }
    if (t.classList && t.classList.contains('export-text')) {
      var beb = active();
      if (!beb) return;
      var eses = ensureExportSettings(beb);
      eses[t.dataset.key] = t.value;
      save();
      return;
    }
    if (t.classList && t.classList.contains('global-name')) {
      var g1 = findGlobalById(t.dataset.id);
      if (g1) { g1.name = t.value; save(); refreshGlobalUsageCells(); }
      return;
    }
    if (t.classList && t.classList.contains('global-value')) {
      suggestGlobalCompletion(t);
      var g2 = findGlobalById(t.dataset.id);
      if (g2) { g2.raw = t.value; g2.value = t.value; propagateAllGlobals(); save(); refreshComputed(); refreshLineInputs(); refreshGlobalUsageCells(); }
      return;
    }
    if (t.classList && t.classList.contains('unit-name')) {
      var bu1 = active(); var idxu1 = Number(t.dataset.idx);
      if (bu1 && bu1.units[idxu1]) { bu1.units[idxu1].name = t.value; save(); refreshAllUnitDisplays(); }
      return;
    }
    if (t.classList && t.classList.contains('unit-plural')) {
      var bu2 = active(); var idxu2 = Number(t.dataset.idx);
      if (bu2 && bu2.units[idxu2]) { bu2.units[idxu2].plural = t.value; save(); refreshAllUnitDisplays(); }
      return;
    }
    if (t.classList && t.classList.contains('fringe-name')) {
      var f1 = findFringe(t.dataset.id);
      if (f1) { f1.name = t.value; save(); }
      return;
    }
    if (t.classList && t.classList.contains('fringe-rate')) {
      var f2 = findFringe(t.dataset.id);
      if (f2) { var fv = parseFloat(t.value); f2.rate = isNaN(fv) ? 0 : fv; save(); refreshComputed(); }
      return;
    }
    if (t.classList && t.classList.contains('group-name')) {
      var gr1 = findGroupTag(t.dataset.id);
      if (gr1) { gr1.name = t.value; save(); render(); }
      return;
    }
    if (t.classList && t.classList.contains('num') && t.dataset.kind === 'account') {
      var accN = findAccount(t.dataset.id);
      if (accN) { accN.num = t.value; save(); }
      return;
    }
    if (t.classList && t.classList.contains('num') && t.dataset.kind === 'subaccount') {
      var foundSubN = findSubAccount(t.dataset.id);
      if (foundSubN) { foundSubN.sub.num = t.value; save(); }
      return;
    }
    if (t.dataset && t.dataset.action === 'edit-notes') {
      var foundN = findSubAccount(t.dataset.subaccount);
      if (!foundN) return;
      var lineN = null;
      for (var kk = 0; kk < foundN.sub.lines.length; kk++) {
        if (foundN.sub.lines[kk].id === t.dataset.id) { lineN = foundN.sub.lines[kk]; break; }

      return;
    }
    if (t.id === 'account-num') {
      var account = findAccount(view.accountId);
      if (account) { account.num = t.value; save(); }
      return;
    }
    if (t.id === 'subaccount-name') {

    var foundLine = findSubAccount(t.dataset.subaccount);

    var line = null;

      suggestGlobalCompletion(t);

    if (!line.raw) line.raw = {};
    line.raw[t.dataset.field] = t.value;
    line[t.dataset.field] = t.value;
    save();
    refreshComputed();

  document.addEventListener('focusout', function (e) {
    var t = e.target;
    if (!t || !t.classList) return;
    if (t.classList.contains('global-value')) {
      var gBlur = findGlobalById(t.dataset.id);
      if (gBlur) {
        gBlur.raw = t.value;
        var gVal = computeGlobalValue(gBlur);
        var gResolved = (gVal == null) ? '' : String(gVal);
        gBlur.value = gResolved;
        t.value = gResolved;
        propagateAllGlobals();
        save();
        refreshComputed();
        refreshLineInputs();
        refreshGlobalUsageCells();
      }
      return;
    }
    if (!(t.classList.contains('qty') || t.classList.contains('x') || t.classList.contains('rate') || t.classList.contains('desc') || t.classList.contains('unit'))) return;
    if (!t.dataset.subaccount || !t.dataset.field) return;
    var found = findSubAccount(t.dataset.subaccount);
    if (!found) return;
    var line = null;
    for (var i = 0; i < found.sub.lines.length; i++) {
      if (found.sub.lines[i].id === t.dataset.id) { line = found.sub.lines[i]; break; }
    }
    if (!line) return;
    if (!line.raw) line.raw = {};
    line.raw[t.dataset.field] = t.value;
    var resolved = resolveGlobalTokens(t.value);
    line[t.dataset.field] = resolved;
    if (t.dataset.field === 'unit') {
      var unitDef = matchUnitDef(resolved);
      if (unitDef) line.unit = unitDef.name;
      t.value = unitDisplayValue(line);
    } else {
      t.value = resolved;
    }
    save();
    refreshComputed();
    if (t.dataset.field === 'qty' || t.dataset.field === 'unit') refreshUnitDisplayForLine(line);
  });

      tooltipEl = document.createElement('div');
      tooltipEl.className = 'app-tooltip';
      document.body.appendChild(tooltipEl);
    }
    return tooltipEl;
  }
  function hideTooltip() {
    if (tooltipEl) tooltipEl.classList.remove('visible');
  }
  function clearTooltipTimer() {
    if (tooltipTimer) { clearTimeout(tooltipTimer); tooltipTimer = null; }
    hideTooltip();
  }
  function positionTooltip(target) {
    var el = ensureTooltipEl();
    el.classList.add('visible');
    var r = target.getBoundingClientRect();
    var tw = el.offsetWidth, th = el.offsetHeight;
    var left = r.left + (r.width / 2) - (tw / 2);
    left = Math.max(6, Math.min(left, window.innerWidth - tw - 6));
    var top = r.top - th - 8;
    if (top < 4) top = r.bottom + 8;
    el.style.left = left + 'px';
    el.style.top = top + 'px';
  }
  document.addEventListener('mouseover', function (e) {
    var el = e.target.closest ? e.target.closest('[data-tooltip], [aria-label]') : null;
    if (!el) return;
    var text = el.getAttribute('data-tooltip') || el.getAttribute('aria-label');
    if (!text) return;
    clearTooltipTimer();
    tooltipTimer = setTimeout(function () {
      var tt = ensureTooltipEl();
      tt.textContent = text;
      positionTooltip(el);
    }, 700);
  }, true);
  document.addEventListener('mouseout', function (e) {
    var el = e.target.closest ? e.target.closest('[data-tooltip], [aria-label]') : null;
    if (!el) return;
    clearTooltipTimer();
  }, true);
  document.addEventListener('mousedown', clearTooltipTimer, true);
  document.addEventListener('scroll', clearTooltipTimer, true);
  window.addEventListener('resize', clearTooltipTimer);

  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredInstallPrompt = e;
    var ib = document.getElementById('install-app-btn');
    if (ib) ib.style.display = 'inline-flex';
  });
  window.addEventListener('appinstalled', function () {
    deferredInstallPrompt = null;
    var ib = document.getElementById('install-app-btn');
    if (ib) ib.style.display = 'none';
  });

  if ((location.protocol === 'https:' || location.hostname === 'localhost') && 'serviceWorker' in navigator) {
    try {
      var swSource = "self.addEventListener('install',function(e){self.skipWaiting();});" +
        "self.addEventListener('activate',function(e){self.clients.claim();});" +
        "var CACHE='nlb-shell-v1';" +
        "self.addEventListener('fetch',function(e){" +
        "if(e.request.method!=='GET')return;" +
        "e.respondWith(caches.open(CACHE).then(function(cache){" +
        "return cache.match(e.request).then(function(cached){" +
        "var fetchPromise=fetch(e.request).then(function(res){cache.put(e.request,res.clone());return res;}).catch(function(){return cached;});" +
        "return cached||fetchPromise;" +
        "}); }));" +
        "});";
      var swBlob = new Blob([swSource], { type: 'application/javascript' });
      var swUrl = URL.createObjectURL(swBlob);
      navigator.serviceWorker.register(swUrl).catch(function () {});
    } catch (e) {}
  }

  render();
})();
</script>
</body>
